name: nebula-studio

services:
  studio:
    image: nebula-studio:${STUDIO_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - STUDIO_VERSION=${STUDIO_VERSION:-dev}
        - GIT_HASH=${GIT_HASH:-unknown}
        - GIT_REF=${GIT_REF:-unknown}
        - STUDIO_BRAND_NAME
        - STUDIO_BRAND_NAME_ZH_CN
        - STUDIO_BRAND_CONSOLE_NAME
        - STUDIO_BRAND_CONSOLE_PROMPT
        - STUDIO_BRAND_STUDIO_TITLE
        - STUDIO_BRAND_GUI_TITLE
        - STUDIO_BRAND_COPYRIGHT
        - STUDIO_BRAND_HELP_URL_TEMPLATE
        - STUDIO_DEFAULT_LANGUAGE
        - SOURCE_URL=${SOURCE_URL:-https://github.com/vesoft-inc/nebula-ng-studio}
        - LICENSES=${LICENSES:-Apache-2.0}
    init: true
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${STUDIO_PORT:-7001}:7001'
    environment:
      - STUDIO_TOKEN_SECRET
      - STUDIO_ENCRYPT_PASSPHRASE
      - STUDIO_HEALTHCHECK_URL
    volumes:
      - studio-data:/app/data
      - type: bind
        source: ${STUDIO_CONFIG_FILE:-./apps/server/etc/config-release.yaml}
        target: /app/etc/config-release.yaml
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    stop_grace_period: 10s

volumes:
  studio-data:
