name: nebula-studio

services:
  studio:
    image: nebula-studio:${STUDIO_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${STUDIO_PORT:-7001}:7001'
    environment:
      - STUDIO_TOKEN_SECRET
      - STUDIO_ENCRYPT_PASSPHRASE
      - STUDIO_HEALTHCHECK_URL
    volumes:
      - studio-data:/app/data
      - type: bind
        source: ${STUDIO_CONFIG_FILE:-./apps/server/etc/config-release.yaml}
        target: /app/etc/config-release.yaml
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    stop_grace_period: 10s

volumes:
  studio-data:
