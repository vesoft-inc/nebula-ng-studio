Name: studio-api
Host: 0.0.0.0
Port: 7001
Timeout: 30000
DefaultHost: '${STUDIO_GRAPHD_DEFAULT_HOST}' # Optional default NebulaGraph domain shown on the login page, for example "graph0"
DefaultPort: '${STUDIO_GRAPHD_DEFAULT_PORT}' # Optional default NebulaGraph port shown on the login page, for example "9669"
Log:
  Mode: file
  Level: info
  KeepDays: 7
Assets:
  Gzip: true
Auth:
  TokenName: studio_token
  TokenIssuer: '${STUDIO_TOKEN_ISSUER}' # Optional; defaults to auth-service
  TokenSecret: '${STUDIO_TOKEN_SECRET}'
  EncryptPassphrase: '${STUDIO_ENCRYPT_PASSPHRASE}' # Must be 16, 24, or 32 bytes when set
  TokenMaxAge: 86400
SSO:
  Oauth2:
    Enable: false
    ServerName: ''
    ClientID: ''
    ClientSecret: ''
    AuthURL: ''
    AccessTokenURL: ''
    UserInfoURL: ''
    RedirectURL: ''
    Scope: 'openid profile email'
    UsernameField: ''
Database:
  Enable: true
  # Database: mysql, sqlite3
  Dialect: sqlite3
  AutoMigrate: true
  # Silent(1), Error(2), Warn(3), Info(4)
  LogLevel: 4
  SqliteFilePath: './data/studio.db'
  # Database host, for example `127.0.0.1` or a deployment-owned DNS name.
  Host: '127.0.0.1'
  # Database port
  Port: 3306
  # Database name
  Name: 'studio'
  # Database user
  Username: ''
  # Database password
  Password: ''
Nebula:
  ClientMaxNum: 200 # The maximum number of different user that can be connected
  ClientPoolMaxWait: 10 # The maximum wait time for the client connection pool, unit: second
  ClientPoolConnsMaxOpen: 10 # The maximum number of connections that can be created in a single connection pool
  ClientPoolConnsMinOpen: 1 # The minimum number of connections that can be created in a single connection pool
  ClientMaxIdleConns: 5 # The maximum number of idle connections in a single connection pool
  ClientExpiredDuration: 14400 # The expire duration time in single client, system will check every 24 hour; unit: minute
  ClientRequestTimeout: 10 # The timeout of the client connection, default is 10, unit: second
