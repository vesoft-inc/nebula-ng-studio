<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NebulaGraph Studio</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #121826;
        --muted: #5c667a;
        --ring: #0d8bff;
        --track: rgba(13, 139, 255, 0.18);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101418;
          --fg: #f2f5f9;
          --muted: #9aa6b8;
          --track: rgba(13, 139, 255, 0.24);
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        padding: 32px;
        text-align: center;
      }

      .logo {
        width: 112px;
        height: 112px;
        filter: drop-shadow(0 12px 24px rgba(13, 139, 255, 0.22));
      }

      h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 650;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }

      .spinner {
        width: 22px;
        height: 22px;
        margin-top: 4px;
        border: 2.5px solid var(--track);
        border-top-color: var(--ring);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
