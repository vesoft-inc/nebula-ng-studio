name: Studio Linux delivery

on:
  workflow_call:
    inputs:
      version:
        description: Studio version without a leading v
        required: true
        type: string
      git_hash:
        description: Full source commit SHA
        required: true
        type: string
      git_ref:
        description: Source branch or release tag
        required: true
        type: string
      artifact_suffix:
        description: Suffix that keeps artifacts unique within the caller run
        required: false
        default: ci
        type: string
      run_package_lifecycle_tests:
        description: Run the slow native package lifecycle and distribution matrix
        required: false
        default: true
        type: boolean

permissions:
  contents: read

# The glibc floor declared in README.md and deploy/linux-tar.md. The archive job
# asserts that the built binary does not require symbol versions above this value,
# and runs that binary on the oldest distribution that provides it.
env:
  GLIBC_FLOOR: '2.17'
  GLIBC_FLOOR_IMAGE: oraclelinux:7-slim@sha256:1add6ed8602ea996528110fe75f4b03c2ca7ffdbe9497148dbb46c3cc9ce6acd
  NFPM_VERSION: '2.47.0'

jobs:
  archive:
    name: Linux ${{ matrix.arch }} delivery
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            machine: x86_64
            nfpm_arch: x86_64
            nfpm_sha256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
            rpm_arch: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
            nfpm_arch: arm64
            nfpm_sha256: 1c0f5f2999b9a974bfb04fdb0cc3306096de530ac5dbb25d739cc5f5219c919c
            rpm_arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_hash }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: pnpm

      - name: Install the native package version dependency
        run: pnpm install --filter nebula-ng-studio-workspace --frozen-lockfile --ignore-scripts

      - name: Validate archive inputs and native runner
        env:
          STUDIO_VERSION: ${{ inputs.version }}
          GIT_HASH: ${{ inputs.git_hash }}
          GIT_REF: ${{ inputs.git_ref }}
          ARTIFACT_SUFFIX: ${{ inputs.artifact_suffix }}
        run: |
          test "$(uname -m)" = '${{ matrix.machine }}'
          test "${#STUDIO_VERSION}" -le 128
          [[ "${STUDIO_VERSION}" =~ ^[A-Za-z0-9][A-Za-z0-9.+-]{0,127}$ ]]
          [[ "${GIT_HASH}" =~ ^[0-9a-f]{7,40}$ ]]
          [[ "${GIT_REF}" =~ ^[A-Za-z0-9._/@+-]{1,255}$ ]]
          [[ "${ARTIFACT_SUFFIX}" =~ ^[a-z0-9-]{1,32}$ ]]

      - name: Build the native Studio bundle
        env:
          STUDIO_VERSION: ${{ inputs.version }}
          GIT_HASH: ${{ inputs.git_hash }}
          GIT_REF: ${{ inputs.git_ref }}
        run: |
          docker buildx build \
            --platform 'linux/${{ matrix.arch }}' \
            --target archive-export \
            --build-arg "STUDIO_VERSION=${STUDIO_VERSION}" \
            --build-arg "GIT_HASH=${GIT_HASH}" \
            --build-arg "GIT_REF=${GIT_REF}" \
            --output "type=local,dest=${RUNNER_TEMP}/studio-bundle" \
            .

          test -s "${RUNNER_TEMP}/studio-bundle/assets/public/index.html"
          test -x "${RUNNER_TEMP}/studio-bundle/studio-migrate-helper"
          find "${RUNNER_TEMP}/studio-bundle/assets/public/assets" -maxdepth 1 -type f -name '*.js' -print -quit | grep -q .
          find "${RUNNER_TEMP}/studio-bundle/assets/public/assets" -maxdepth 1 -type f -name '*.css' -print -quit | grep -q .

      - name: Assemble the deterministic archive
        env:
          STUDIO_VERSION: ${{ inputs.version }}
        run: |
          archive_root="nebula-studio-${STUDIO_VERSION}"
          staging_root="${RUNNER_TEMP}/archive-stage"
          release_root="${GITHUB_WORKSPACE}/dist/release"
          archive="nebula-studio-${STUDIO_VERSION}-linux-${{ matrix.arch }}.tar.gz"

          mkdir -p "${staging_root}/${archive_root}/bin" "${staging_root}/${archive_root}/assets" \
            "${staging_root}/${archive_root}/etc" "${staging_root}/${archive_root}/scripts" "${release_root}"
          install -m 0755 "${RUNNER_TEMP}/studio-bundle/studio" "${staging_root}/${archive_root}/bin/studio"
          install -m 0755 scripts/studio.service "${staging_root}/${archive_root}/scripts/studio.service"
          cp -a "${RUNNER_TEMP}/studio-bundle/assets/public" "${staging_root}/${archive_root}/assets/public"
          chmod -R u=rwX,go=rX "${staging_root}/${archive_root}/assets/public"
          install -m 0644 apps/server/etc/config-release.yaml "${staging_root}/${archive_root}/etc/config.yaml"
          install -m 0644 deploy/linux-tar.md "${staging_root}/${archive_root}/README.md"
          install -m 0644 LICENSE "${staging_root}/${archive_root}/LICENSE"

          tar \
            --directory "${staging_root}" \
            --format=ustar \
            --sort=name \
            --mtime=@0 \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -cf - \
            "${archive_root}" | gzip -n -9 > "${release_root}/${archive}"
          (cd "${release_root}" && sha256sum "${archive}" > "${archive}.sha256")

      - name: Verify the archive contract and runtime
        env:
          STUDIO_VERSION: ${{ inputs.version }}
          GIT_HASH: ${{ inputs.git_hash }}
          GIT_REF: ${{ inputs.git_ref }}
        run: |
          archive_root="nebula-studio-${STUDIO_VERSION}"
          release_root="${GITHUB_WORKSPACE}/dist/release"
          archive="nebula-studio-${STUDIO_VERSION}-linux-${{ matrix.arch }}.tar.gz"
          smoke_root="${RUNNER_TEMP}/archive-smoke"
          actual_tree="${RUNNER_TEMP}/actual-tree.txt"

          tar -tzf "${release_root}/${archive}" | sort > "${actual_tree}"
          grep -Fxq "${archive_root}/bin/studio" "${actual_tree}"
          grep -Fxq "${archive_root}/assets/public/index.html" "${actual_tree}"
          grep -Fxq "${archive_root}/etc/config.yaml" "${actual_tree}"
          grep -Fxq "${archive_root}/README.md" "${actual_tree}"
          grep -Fxq "${archive_root}/LICENSE" "${actual_tree}"
          grep -Fxq "${archive_root}/scripts/studio.service" "${actual_tree}"
          # The service script must stay executable after packaging.
          tar -tvzf "${release_root}/${archive}" "${archive_root}/scripts/studio.service" | grep -Eq '^-rwxr-xr-x '
          (cd "${release_root}" && sha256sum --check "${archive}.sha256")

          mkdir -p "${smoke_root}"
          tar -xzf "${release_root}/${archive}" -C "${smoke_root}"
          version_output=$("${smoke_root}/${archive_root}/bin/studio" -v)
          grep -F "V${STUDIO_VERSION}" <<< "${version_output}"
          grep -F "Git Ref: ${GIT_REF}" <<< "${version_output}"
          grep -F "Git Hash: ${GIT_HASH}" <<< "${version_output}"
          test -s "${smoke_root}/${archive_root}/assets/public/index.html"
          find "${smoke_root}/${archive_root}/assets/public/assets" -maxdepth 1 -type f -name '*.js' -print -quit | grep -q .
          find "${smoke_root}/${archive_root}/assets/public/assets" -maxdepth 1 -type f -name '*.css' -print -quit | grep -q .

          cd "${smoke_root}/${archive_root}"
          test ! -e pids/studio.pid
          ./scripts/studio.service start studio
          ./scripts/studio.service status studio
          test -s pids/studio.pid
          test -s logs/studio.log
          curl --fail --silent http://127.0.0.1:7001/api-studio/health | grep -Fqx '{"status":"ok"}'
          curl --fail --silent http://127.0.0.1:7001/api-studio/health/ready | grep -Fqx '{"database":"ok"}'
          curl --fail --silent http://127.0.0.1:7001/api-studio/db/oauth2-config | grep -Fq '"enabled":false'
          ./scripts/studio.service restart studio
          ./scripts/studio.service status studio
          ./scripts/studio.service stop studio
          test ! -e pids/studio.pid
          if ./scripts/studio.service status studio; then
            echo 'status must report a stopped daemon as not running' >&2
            exit 1
          fi

      - name: Assert the GLIBC symbol ceiling
        env:
          STUDIO_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          archive_root="nebula-studio-${STUDIO_VERSION}"
          binary="${RUNNER_TEMP}/archive-smoke/${archive_root}/bin/studio"
          highest=$(readelf -V "${binary}" | grep -o 'GLIBC_[0-9.]*' | sort -V -u | tail -1 || true)
          if [ -z "${highest}" ]; then
            echo 'Binary has no versioned GLIBC symbols (statically linked); floor assertion is not applicable.'
            exit 0
          fi
          echo "Highest required symbol: ${highest}; declared floor: GLIBC_${GLIBC_FLOOR}"
          newest=$(printf '%s\n' "GLIBC_${GLIBC_FLOOR}" "${highest}" | sort -V | tail -1)
          if [ "${newest}" != "GLIBC_${GLIBC_FLOOR}" ]; then
            echo "::error::Binary requires ${highest}, newer than the declared floor GLIBC_${GLIBC_FLOOR}." >&2
            echo 'Raise the documented floor and support matrix, or lower the build baseline.' >&2
            exit 1
          fi

      - name: Run the archive binary on the oldest supported glibc
        env:
          STUDIO_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          archive_root="nebula-studio-${STUDIO_VERSION}"
          smoke_root="${RUNNER_TEMP}/archive-smoke/${archive_root}"
          # Native runner platform matches the archive architecture, so no --platform
          # override is needed. The loader refuses to start a binary whose symbol
          # versions exceed this distribution's glibc (2.17), which is exactly the
          # declared floor.
          container_version=$(docker run --rm -v "${smoke_root}:/work:ro" -w /work "${GLIBC_FLOOR_IMAGE}" ./bin/studio -v)
          grep -F "V${STUDIO_VERSION}" <<< "${container_version}"
          echo "${GLIBC_FLOOR_IMAGE} (glibc ${GLIBC_FLOOR}) ran the archive binary successfully."

      - name: Resolve native package versions
        id: package-version
        env:
          PACKAGE_SOURCE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mapping=$(node scripts/native-package-version.mjs "${PACKAGE_SOURCE_VERSION}")
          echo "deb_version=$(jq -r .debVersion <<< "${mapping}")" >> "${GITHUB_OUTPUT}"
          echo "deb_file_version=$(jq -r .debFileVersion <<< "${mapping}")" >> "${GITHUB_OUTPUT}"
          echo "deb_upstream=$(jq -r .debUpstream <<< "${mapping}")" >> "${GITHUB_OUTPUT}"
          echo "rpm_version=$(jq -r .rpmVersion <<< "${mapping}")" >> "${GITHUB_OUTPUT}"
          echo "rpm_file_version=$(jq -r .rpmFileVersion <<< "${mapping}")" >> "${GITHUB_OUTPUT}"

      - name: Verify common native package version ordering
        run: |
          set -euo pipefail
          dpkg --compare-versions '5.4.0~alpha.1-1' lt '5.4.0~alpha.2-1'
          dpkg --compare-versions '5.4.0~alpha.2-1' lt '5.4.0~beta.1-1'
          dpkg --compare-versions '5.4.0~beta.1-1' lt '5.4.0~rc.1-1'
          dpkg --compare-versions '5.4.0~rc.1-1' lt '5.4.0-1'
          compare_rpm() {
            test "$(docker run --rm "${GLIBC_FLOOR_IMAGE}" \
              rpm --eval "%{lua:print(rpm.vercmp(\"$1\", \"$2\"))}")" = -1
          }
          compare_rpm '5.4.0~alpha.1' '5.4.0~alpha.2'
          compare_rpm '5.4.0~alpha.2' '5.4.0~beta.1'
          compare_rpm '5.4.0~beta.1' '5.4.0~rc.1'
          compare_rpm '5.4.0~rc.1' '5.4.0'

      - name: Install the pinned nFPM packager
        env:
          NFPM_SHA256: ${{ matrix.nfpm_sha256 }}
        run: |
          set -euo pipefail
          archive="nfpm_${NFPM_VERSION}_Linux_${{ matrix.nfpm_arch }}.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          printf '%s  %s\n' "${NFPM_SHA256}" "${RUNNER_TEMP}/${archive}" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" nfpm
          "${RUNNER_TEMP}/nfpm" --version | grep -F "${NFPM_VERSION}"

      - name: Build deterministic DEB and RPM packages
        env:
          DEB_VERSION: ${{ steps.package-version.outputs.deb_version }}
          DEB_FILE_VERSION: ${{ steps.package-version.outputs.deb_file_version }}
          DEB_UPSTREAM: ${{ steps.package-version.outputs.deb_upstream }}
          RPM_VERSION: ${{ steps.package-version.outputs.rpm_version }}
          RPM_FILE_VERSION: ${{ steps.package-version.outputs.rpm_file_version }}
        run: |
          set -euo pipefail
          release_root="${GITHUB_WORKSPACE}/dist/release"
          package_root="${RUNNER_TEMP}/studio-bundle"
          deb="nebula-studio_${DEB_FILE_VERSION}_${{ matrix.arch }}.deb"
          rpm="nebula-studio-${RPM_FILE_VERSION}-1.${{ matrix.rpm_arch }}.rpm"
          export PACKAGE_ARCH='${{ matrix.arch }}'
          export PACKAGE_ROOT="${package_root}"
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct '${{ inputs.git_hash }}')
          find "${package_root}" -exec touch --no-dereference --date="@${SOURCE_DATE_EPOCH}" {} +

          PACKAGE_VERSION="${DEB_UPSTREAM}" "${RUNNER_TEMP}/nfpm" package \
            --config packaging/nfpm.yaml --packager deb --target "${release_root}/${deb}"
          PACKAGE_VERSION="${RPM_VERSION}" "${RUNNER_TEMP}/nfpm" package \
            --config packaging/nfpm.yaml --packager rpm --target "${release_root}/${rpm}"
          (cd "${release_root}" && sha256sum "${deb}" > "${deb}.sha256" && sha256sum "${rpm}" > "${rpm}.sha256")

          reproducible_root="${RUNNER_TEMP}/reproducible-packages"
          mkdir -p "${reproducible_root}"
          PACKAGE_VERSION="${DEB_UPSTREAM}" "${RUNNER_TEMP}/nfpm" package \
            --config packaging/nfpm.yaml --packager deb --target "${reproducible_root}/${deb}"
          PACKAGE_VERSION="${RPM_VERSION}" "${RUNNER_TEMP}/nfpm" package \
            --config packaging/nfpm.yaml --packager rpm --target "${reproducible_root}/${rpm}"
          cmp "${release_root}/${deb}" "${reproducible_root}/${deb}"
          cmp "${release_root}/${rpm}" "${reproducible_root}/${rpm}"

          upgrade_root="${RUNNER_TEMP}/upgrade-packages"
          mkdir -p "${upgrade_root}"
          PACKAGE_VERSION='0.0.0~dev.build' "${RUNNER_TEMP}/nfpm" package \
            --config packaging/nfpm.yaml --packager deb --target "${upgrade_root}/nebula-studio-old.deb"
          PACKAGE_VERSION='0.0.0~dev.build' "${RUNNER_TEMP}/nfpm" package \
            --config packaging/nfpm.yaml --packager rpm --target "${upgrade_root}/nebula-studio-old.rpm"
          dpkg --compare-versions '0.0.0~dev.build-1' lt "${DEB_VERSION}"
          test "$(docker run --rm "${GLIBC_FLOOR_IMAGE}" \
            rpm --eval "%{lua:print(rpm.vercmp(\"0.0.0~dev.build\", \"${RPM_VERSION}\"))}")" = -1

          archive="nebula-studio-${{ inputs.version }}-linux-${{ matrix.arch }}.tar.gz"
          printf '%s\n' \
            "${archive}" "${archive}.sha256" \
            "${deb}" "${deb}.sha256" \
            "${rpm}" "${rpm}.sha256" \
            > "${release_root}/assets-${{ matrix.arch }}.txt"

      - name: Verify native package metadata and contents
        env:
          DEB_VERSION: ${{ steps.package-version.outputs.deb_version }}
          DEB_FILE_VERSION: ${{ steps.package-version.outputs.deb_file_version }}
          RPM_VERSION: ${{ steps.package-version.outputs.rpm_version }}
          RPM_FILE_VERSION: ${{ steps.package-version.outputs.rpm_file_version }}
        run: |
          set -euo pipefail
          release_root="${GITHUB_WORKSPACE}/dist/release"
          deb="${release_root}/nebula-studio_${DEB_FILE_VERSION}_${{ matrix.arch }}.deb"
          rpm="${release_root}/nebula-studio-${RPM_FILE_VERSION}-1.${{ matrix.rpm_arch }}.rpm"

          test "$(dpkg-deb -f "${deb}" Package)" = nebula-studio
          test "$(dpkg-deb -f "${deb}" Architecture)" = '${{ matrix.arch }}'
          test "$(dpkg-deb -f "${deb}" Version)" = "${DEB_VERSION}"
          deb_contents="${RUNNER_TEMP}/deb-contents-${{ matrix.arch }}.txt"
          dpkg-deb --contents "${deb}" > "${deb_contents}"
          grep -Fq './usr/lib/nebula-studio/bin/studio' "${deb_contents}"
          grep -Fq './etc/nebula-studio/config.yaml' "${deb_contents}"
          grep -Fq './lib/systemd/system/nebula-studio.service' "${deb_contents}"

          docker run --rm -v "${release_root}:/work:ro" "${GLIBC_FLOOR_IMAGE}" \
            rpm -qp --queryformat '%{NAME} %{VERSION}-%{RELEASE} %{ARCH}\n' "/work/$(basename "${rpm}")" \
            | grep -Fx "nebula-studio ${RPM_VERSION}-1 ${{ matrix.rpm_arch }}"
          docker run --rm -v "${release_root}:/work:ro" "${GLIBC_FLOOR_IMAGE}" \
            rpm -qpl "/work/$(basename "${rpm}")" | grep -Fx '/usr/lib/nebula-studio/bin/studio'
          (cd "${release_root}" && sha256sum --check "$(basename "${deb}").sha256" "$(basename "${rpm}").sha256")

      - name: Verify DEB service lifecycle on the native runner
        if: inputs.run_package_lifecycle_tests
        env:
          DEB_VERSION: ${{ steps.package-version.outputs.deb_version }}
          DEB_FILE_VERSION: ${{ steps.package-version.outputs.deb_file_version }}
        run: |
          set -euo pipefail
          deb="${GITHUB_WORKSPACE}/dist/release/nebula-studio_${DEB_FILE_VERSION}_${{ matrix.arch }}.deb"
          old_deb="${RUNNER_TEMP}/upgrade-packages/nebula-studio-old.deb"
          sudo dpkg --install "${old_deb}"
          test "$(systemctl is-enabled nebula-studio.service 2>/dev/null || true)" = disabled
          ! systemctl is-active --quiet nebula-studio.service
          echo '# package-upgrade-preserved' | sudo tee -a /etc/nebula-studio/config.yaml >/dev/null
          sudo systemctl enable nebula-studio.service
          sudo systemctl start nebula-studio.service
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:7001/api-studio/health | grep -Fqx '{"status":"ok"}'; then
              break
            fi
            test "${attempt}" -lt 30
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:7001/api-studio/health/ready | grep -Fqx '{"database":"ok"}'
          sudo find /var/log/nebula-studio -maxdepth 1 -type f -size +0 -print -quit | grep -q .
          sudo dpkg --install "${deb}"
          ! systemctl is-active --quiet nebula-studio.service
          test "$(systemctl is-enabled nebula-studio.service)" = enabled
          sudo grep -Fqx '# package-upgrade-preserved' /etc/nebula-studio/config.yaml
          sudo systemctl start nebula-studio.service
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:7001/api-studio/health | grep -Fqx '{"status":"ok"}'; then
              break
            fi
            test "${attempt}" -lt 30
            sleep 1
          done
          sudo systemctl stop nebula-studio.service
          sudo dpkg --install "${deb}"
          ! systemctl is-active --quiet nebula-studio.service
          test "$(systemctl is-enabled nebula-studio.service)" = enabled
          sudo systemctl disable nebula-studio.service
          sudo systemctl mask nebula-studio.service
          sudo dpkg --install "${deb}"
          ! systemctl is-active --quiet nebula-studio.service
          test "$(systemctl is-enabled nebula-studio.service 2>/dev/null || true)" = masked
          sudo systemctl unmask nebula-studio.service
          sudo mkdir /tmp/nebula-studio-package-state-victim
          echo original | sudo tee /tmp/nebula-studio-package-state-victim/config.yaml >/dev/null
          sudo ln -s /tmp/nebula-studio-package-state-victim /var/lib/nebula-studio-package
          if sudo dpkg --remove nebula-studio; then
            echo 'Package removal unexpectedly accepted a symlinked state directory.' >&2
            exit 1
          fi
          test "$(sudo cat /tmp/nebula-studio-package-state-victim/config.yaml)" = original
          dpkg-query --show nebula-studio >/dev/null
          sudo rm -- /var/lib/nebula-studio-package
          echo original | sudo tee /tmp/nebula-studio-package-victim >/dev/null
          sudo -u nebula-studio ln -s /tmp/nebula-studio-package-victim \
            /var/lib/nebula-studio/.uninstall-config.yaml
          sudo dpkg --remove nebula-studio
          test "$(cat /tmp/nebula-studio-package-victim)" = original
          sudo test -f /var/lib/nebula-studio/studio.db
          sudo test -f /etc/nebula-studio/config.yaml
          sudo test ! -e /var/lib/nebula-studio-package
          sudo dpkg --purge nebula-studio
          sudo test ! -f /etc/nebula-studio/config.yaml
          sudo test -f /var/lib/nebula-studio/studio.db

      - name: Verify packages install on supported distribution families
        if: inputs.run_package_lifecycle_tests
        env:
          DEB_VERSION: ${{ steps.package-version.outputs.deb_version }}
          DEB_FILE_VERSION: ${{ steps.package-version.outputs.deb_file_version }}
          RPM_VERSION: ${{ steps.package-version.outputs.rpm_version }}
          RPM_FILE_VERSION: ${{ steps.package-version.outputs.rpm_file_version }}
        run: |
          set -euo pipefail
          release_root="${GITHUB_WORKSPACE}/dist/release"
          deb="nebula-studio_${DEB_FILE_VERSION}_${{ matrix.arch }}.deb"
          rpm="nebula-studio-${RPM_FILE_VERSION}-1.${{ matrix.rpm_arch }}.rpm"
          for image in ubuntu:22.04 ubuntu:24.04 debian:12-slim debian:13-slim; do
            docker run --rm -v "${release_root}:/work:ro" "${image}" sh -ceu '
              apt-get update >/dev/null
              if ! apt-get install -y "/work/$1" > /tmp/studio-install.log 2>&1; then
                cat /tmp/studio-install.log >&2
                exit 1
              fi
              test -x /usr/lib/nebula-studio/bin/studio
              test ! -e /run/systemd/system
              printf preserved > /var/lib/nebula-studio/studio.db
              chown nebula-studio:nebula-studio /var/lib/nebula-studio/studio.db
              if ! dpkg --remove nebula-studio > /tmp/studio-remove.log 2>&1; then
                cat /tmp/studio-remove.log >&2
                exit 1
              fi
              test -f /var/lib/nebula-studio/studio.db
            ' sh "${deb}"
          done
          for image in rockylinux:9 rockylinux/rockylinux:10; do
            docker run --rm -v "${release_root}:/work:ro" "${image}" sh -ceu '
              if ! dnf install -y "/work/$1" > /tmp/studio-install.log 2>&1; then
                cat /tmp/studio-install.log >&2
                exit 1
              fi
              test -x /usr/lib/nebula-studio/bin/studio
              test ! -e /run/systemd/system
              printf preserved > /var/lib/nebula-studio/studio.db
              chown nebula-studio:nebula-studio /var/lib/nebula-studio/studio.db
              if ! rpm -e nebula-studio > /tmp/studio-remove.log 2>&1; then
                cat /tmp/studio-remove.log >&2
                exit 1
              fi
              test -f /var/lib/nebula-studio/studio.db
            ' sh "${rpm}"
          done

      - name: Verify RPM service upgrades under systemd
        if: inputs.run_package_lifecycle_tests
        env:
          RPM_FILE_VERSION: ${{ steps.package-version.outputs.rpm_file_version }}
        run: |
          set -euo pipefail
          release_root="${GITHUB_WORKSPACE}/dist/release"
          upgrade_root="${RUNNER_TEMP}/upgrade-packages"
          rpm="nebula-studio-${RPM_FILE_VERSION}-1.${{ matrix.rpm_arch }}.rpm"
          for specification in 'rockylinux:9 rocky9' 'rockylinux/rockylinux:10 rocky10'; do
            read -r image suffix <<< "${specification}"
            container="studio-rpm-${suffix}-${{ matrix.arch }}-${GITHUB_RUN_ID}"
            test_image="studio-systemd-${suffix}-${{ matrix.arch }}:${GITHUB_RUN_ID}"
            docker build --progress=plain \
              --platform 'linux/${{ matrix.arch }}' \
              --build-arg "ROCKY_BASE=${image}" \
              --file .github/docker/rocky-systemd.Dockerfile \
              --tag "${test_image}" .
            docker run --detach --privileged --cgroupns=host \
              --name "${container}" \
              --volume /sys/fs/cgroup:/sys/fs/cgroup:rw \
              --volume "${release_root}:/release:ro" \
              --volume "${upgrade_root}:/upgrade:ro" \
              "${test_image}"
            cleanup_container() { docker rm --force "${container}" >/dev/null 2>&1 || true; }
            trap cleanup_container EXIT
            for attempt in {1..180}; do
              if [[ $(docker inspect --format '{{.State.Running}}' "${container}") != true ]]; then
                docker inspect --format '{{json .State}}' "${container}" >&2
                docker logs "${container}" >&2
                exit 1
              fi
              state=$(docker exec "${container}" systemctl is-system-running 2>&1 || true)
              # A container can remain globally "starting" while unrelated default
              # units time out. The manager is usable at this point; the Studio
              # enable/start/stop and health assertions below are the real lifecycle gate.
              if [[ ${state} == starting || ${state} == running || ${state} == degraded ]]; then break; fi
              if [[ ${attempt} -eq 180 ]]; then
                echo "systemd did not become usable (last state: ${state:-empty})." >&2
                docker inspect --format '{{json .State}}' "${container}" >&2
                docker exec "${container}" systemctl --no-pager --failed >&2 || true
                docker logs "${container}" >&2
                exit 1
              fi
              sleep 1
            done

            docker exec "${container}" dnf install -y /upgrade/nebula-studio-old.rpm >/dev/null
            test "$(docker exec "${container}" systemctl is-enabled nebula-studio.service 2>/dev/null || true)" = disabled
            ! docker exec "${container}" systemctl is-active --quiet nebula-studio.service
            docker exec "${container}" sh -c "echo '# package-upgrade-preserved' >> /etc/nebula-studio/config.yaml"
            docker exec "${container}" systemctl enable nebula-studio.service
            docker exec "${container}" systemctl start nebula-studio.service
            for attempt in {1..30}; do
              if docker exec "${container}" /usr/lib/nebula-studio/bin/studio \
                -healthcheck http://127.0.0.1:7001/api-studio/health; then break; fi
              test "${attempt}" -lt 30
              sleep 1
            done
            docker exec "${container}" dnf install -y "/release/${rpm}" >/dev/null
            ! docker exec "${container}" systemctl is-active --quiet nebula-studio.service
            test "$(docker exec "${container}" systemctl is-enabled nebula-studio.service)" = enabled
            docker exec "${container}" grep -Fqx '# package-upgrade-preserved' /etc/nebula-studio/config.yaml
            docker exec "${container}" systemctl start nebula-studio.service
            for attempt in {1..30}; do
              if docker exec "${container}" /usr/lib/nebula-studio/bin/studio \
                -healthcheck http://127.0.0.1:7001/api-studio/health; then break; fi
              test "${attempt}" -lt 30
              sleep 1
            done
            docker exec "${container}" rpm -e nebula-studio
            docker exec "${container}" test -f /var/lib/nebula-studio/studio.db
            cleanup_container
            trap - EXIT
          done

      - name: Verify systemd 219 command compatibility
        if: inputs.run_package_lifecycle_tests
        run: |
          set -euo pipefail
          output=$(docker run --rm "${GLIBC_FLOOR_IMAGE}" sh -c \
            'systemctl show nebula-graph-studio.service --property=FragmentPath 2>&1 || true')
          ! grep -Fq 'unrecognized option' <<< "${output}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: studio-linux-${{ matrix.arch }}-${{ inputs.artifact_suffix }}
          path: |
            dist/release/*
          if-no-files-found: error
          retention-days: 3
