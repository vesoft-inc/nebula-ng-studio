name: Promote published Studio release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published Studio Release tag to promote, for example v5.4.0
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: studio-release-channels
  cancel-in-progress: false

env:
  CI: true
  HUSKY: 0
  NODE_VERSION: '24.21.0'
  STUDIO_IMAGE: ghcr.io/${{ github.repository_owner }}/nebula-studio
  STUDIO_DOCKERHUB_IMAGE: docker.io/vesoft/nebula-studio

jobs:
  promote:
    name: Promote immutable image channels
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install the release policy dependency
        run: pnpm install --filter nebula-ng-studio-workspace --frozen-lockfile --ignore-scripts

      - name: Resolve and verify the published Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RELEASE_ID: ${{ github.event.release.id }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" = release ]; then
            release_tag="${EVENT_RELEASE_TAG}"
          else
            release_tag="${INPUT_RELEASE_TAG}"
          fi
          [[ "${release_tag}" =~ ^v[A-Za-z0-9._+-]{1,254}$ ]] || {
            echo "Invalid Release tag '${release_tag}'." >&2
            exit 1
          }

          release_json="${RUNNER_TEMP}/published-release.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}" > "${release_json}"
          jq -e --arg tag "${release_tag}" '
            .draft == false
            and .published_at != null
            and .tag_name == $tag
          ' "${release_json}" >/dev/null
          if [ "${EVENT_NAME}" = release ]; then
            test "$(jq -r .id "${release_json}")" = "${EVENT_RELEASE_ID}"
          fi

          version="${release_tag#v}"
          is_prerelease=$(jq -r .prerelease "${release_json}")
          policy_json="${RUNNER_TEMP}/candidate-policy.json"
          node scripts/release-channel-policy.mjs classify "${version}" "${is_prerelease}" > "${policy_json}"
          test "${release_tag}" = "v$(jq -r .version "${policy_json}")"

          tag_ref_json="${RUNNER_TEMP}/release-tag-ref.json"
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${release_tag}" > "${tag_ref_json}"
          jq -e --arg ref "refs/tags/${release_tag}" '
            .ref == $ref
            and .object.type == "tag"
            and (.object.sha | test("^[0-9a-f]{40}$"))
          ' "${tag_ref_json}" >/dev/null || {
            echo "${release_tag} must be an annotated tag." >&2
            exit 1
          }

          tag_object_sha=$(jq -r .object.sha "${tag_ref_json}")
          tag_object_json="${RUNNER_TEMP}/release-tag-object.json"
          gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" > "${tag_object_json}"
          jq -e --arg tag "${release_tag}" '
            .tag == $tag
            and .object.type == "commit"
            and (.object.sha | test("^[0-9a-f]{40}$"))
          ' "${tag_object_json}" >/dev/null || {
            echo "${release_tag} must point directly to a commit." >&2
            exit 1
          }
          target_sha=$(jq -r .object.sha "${tag_object_json}")
          [[ "${target_sha}" =~ ^[0-9a-f]{40}$ ]]

          manifest_json="${RUNNER_TEMP}/release-manifest.json"
          gh api "repos/${GITHUB_REPOSITORY}/contents/apps/web/package.json?ref=${target_sha}" > "${manifest_json}"
          jq -e '.type == "file" and .encoding == "base64"' "${manifest_json}" >/dev/null
          manifest_version=$(jq -r .content "${manifest_json}" | base64 --decode | jq -r '.version // empty')
          test "${manifest_version}" = "${version}" || {
            echo "${release_tag} points to ${target_sha}, whose Web package version is '${manifest_version}'." >&2
            exit 1
          }

          image=$(printf '%s' "${STUDIO_IMAGE}" | tr '[:upper:]' '[:lower:]')
          [[ "${image}" =~ ^ghcr\.io/[a-z0-9._-]+/nebula-studio$ ]]
          dockerhub_image="${STUDIO_DOCKERHUB_IMAGE}"
          test "${dockerhub_image}" = docker.io/vesoft/nebula-studio
          channels=$(jq -c .channels "${policy_json}")
          release_url=$(jq -r .html_url "${release_json}")
          {
            echo "version=${version}"
            echo "tag=${release_tag}"
            echo "target_sha=${target_sha}"
            echo "is_prerelease=${is_prerelease}"
            echo "kind=$(jq -r .kind "${policy_json}")"
            echo "channels=${channels}"
            echo "image=${image}"
            echo "dockerhub_image=${dockerhub_image}"
            echo "release_url=${release_url}"
          } >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Require Docker Hub organization secrets
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -z "${DOCKER_USERNAME}" ] || [ -z "${DOCKER_PASSWORD}" ]; then
            echo 'DOCKER_USERNAME and DOCKER_PASSWORD must be available to this repository as organization secrets.' >&2
            exit 1
          fi

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Verify both immutable version images
        id: image
        env:
          GHCR_IMAGE: ${{ steps.release.outputs.image }}
          DOCKERHUB_IMAGE: ${{ steps.release.outputs.dockerhub_image }}
          STUDIO_VERSION: ${{ steps.release.outputs.version }}
          TARGET_SHA: ${{ steps.release.outputs.target_sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          ghcr_digest=''
          for registry in ghcr dockerhub; do
            case "${registry}" in
              ghcr) image="${GHCR_IMAGE}" ;;
              dockerhub) image="${DOCKERHUB_IMAGE}" ;;
            esac
            image_ref="${image}:${STUDIO_VERSION}"
            image_info="${RUNNER_TEMP}/${registry}-source-image.txt"
            image_json="${RUNNER_TEMP}/${registry}-source-image.json"
            docker buildx imagetools inspect "${image_ref}" > "${image_info}"
            docker buildx imagetools inspect "${image_ref}" --raw > "${image_json}"

            jq -e --arg version "${STUDIO_VERSION}" --arg revision "${TARGET_SHA}" --arg source "${SOURCE_URL}" '
              [.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest] as $amd |
              [.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest] as $arm |
              .annotations["org.opencontainers.image.version"] == $version
              and .annotations["org.opencontainers.image.revision"] == $revision
              and .annotations["org.opencontainers.image.source"] == $source
              and (($amd | length) == 1)
              and (($arm | length) == 1)
              and (([.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest"
                and .annotations["vnd.docker.reference.digest"] == $amd[0])] | length) == 1)
              and (([.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest"
                and .annotations["vnd.docker.reference.digest"] == $arm[0])] | length) == 1)
            ' "${image_json}" >/dev/null || {
              echo "${image_ref} lacks the expected index, annotations, platforms, or provenance." >&2
              exit 1
            }

            digest=$(awk '$1 == "Digest:" { print $2; exit }' "${image_info}")
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            if [ "${registry}" = ghcr ]; then
              ghcr_digest="${digest}"
            else
              test "${digest}" = "${ghcr_digest}" || {
                echo "${image_ref} has digest ${digest}, not the GHCR digest ${ghcr_digest}." >&2
                exit 1
              }
            fi
          done
          echo "digest=${ghcr_digest}" >> "${GITHUB_OUTPUT}"
          echo "dockerhub_digest=${ghcr_digest}" >> "${GITHUB_OUTPUT}"

      - name: Plan monotonic channel updates
        id: plan
        env:
          CHANNELS: ${{ steps.release.outputs.channels }}
          GHCR_IMAGE: ${{ steps.release.outputs.image }}
          DOCKERHUB_IMAGE: ${{ steps.release.outputs.dockerhub_image }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IS_PRERELEASE: ${{ steps.release.outputs.is_prerelease }}
          STUDIO_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          decisions="${RUNNER_TEMP}/promotion-decisions.tsv"
          : > "${decisions}"

          mapfile -t channels < <(jq -r '.[]' <<< "${CHANNELS}")
          if [ "${#channels[@]}" -eq 0 ]; then
            echo 'mode=immutable-only' >> "${GITHUB_OUTPUT}"
            echo "${STUDIO_VERSION} is an immutable-only prerelease; no mutable channels apply."
            exit 0
          fi
          echo 'mode=channels' >> "${GITHUB_OUTPUT}"
          for registry in ghcr dockerhub; do
            case "${registry}" in
              ghcr) image="${GHCR_IMAGE}" ;;
              dockerhub) image="${DOCKERHUB_IMAGE}" ;;
            esac
            promote_channels="${RUNNER_TEMP}/promotion-channels-${registry}.txt"
            : > "${promote_channels}"

            for channel in "${channels[@]}"; do
              channel_ref="${image}:${channel}"
              channel_id=${channel//[^A-Za-z0-9]/-}
              inspect_text="${RUNNER_TEMP}/${registry}-channel-${channel_id}.txt"
              inspect_json="${RUNNER_TEMP}/${registry}-channel-${channel_id}.json"
              inspect_error="${RUNNER_TEMP}/${registry}-channel-${channel_id}.error"

              if docker buildx imagetools inspect "${channel_ref}" > "${inspect_text}" 2> "${inspect_error}"; then
                docker buildx imagetools inspect "${channel_ref}" --raw > "${inspect_json}"
              elif grep -Eqi \
                -e 'unauthorized|denied|timeout|connection|TLS|rate limit' \
                -e '401 Unauthorized|403 Forbidden|429 Too Many Requests|5[0-9]{2} (Internal|Bad|Service|Gateway)' \
                "${inspect_error}"; then
                cat "${inspect_error}" >&2
                printf '%s\t%s\tfailed\tregistry inspection failed\n' "${registry}" "${channel}" >> "${decisions}"
                exit 1
              elif grep -Eqi 'not found|manifest unknown|name unknown' "${inspect_error}"; then
                printf '%s\t%s\tplanned\tchannel does not exist\n' "${registry}" "${channel}" >> "${decisions}"
                printf '%s\n' "${channel}" >> "${promote_channels}"
                continue
              else
                cat "${inspect_error}" >&2
                printf '%s\t%s\tfailed\tregistry inspection failed\n' "${registry}" "${channel}" >> "${decisions}"
                exit 1
              fi

              current_digest=$(awk '$1 == "Digest:" { print $2; exit }' "${inspect_text}")
              current_version=$(jq -r '.annotations["org.opencontainers.image.version"] // empty' "${inspect_json}")
              if [[ ! "${current_digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || [ -z "${current_version}" ]; then
                printf '%s\t%s\tfailed\tcurrent digest or version annotation is invalid\n' "${registry}" "${channel}" >> "${decisions}"
                echo "${channel_ref} has no trustworthy digest and version annotation." >&2
                exit 1
              fi

              if ! current_policy=$(node scripts/release-channel-policy.mjs classify "${current_version}" "${IS_PRERELEASE}"); then
                printf '%s\t%s\tfailed\tcurrent version is invalid for this release kind\n' "${registry}" "${channel}" >> "${decisions}"
                exit 1
              fi
              if ! jq -e --arg channel "${channel}" '.channels | index($channel) != null' <<< "${current_policy}" >/dev/null; then
                printf '%s\t%s\tfailed\tcurrent version does not belong to this channel\n' "${registry}" "${channel}" >> "${decisions}"
                echo "${channel_ref} points to ${current_version}, which does not belong to ${channel}." >&2
                exit 1
              fi

              relation=$(node scripts/release-channel-policy.mjs compare "${STUDIO_VERSION}" "${current_version}")
              case "${relation}" in
                advance)
                  printf '%s\t%s\tplanned\tadvance from %s\n' "${registry}" "${channel}" "${current_version}" >> "${decisions}"
                  printf '%s\n' "${channel}" >> "${promote_channels}"
                  ;;
                equal)
                  if [ "${current_digest}" != "${IMAGE_DIGEST}" ]; then
                    printf '%s\t%s\tfailed\tsame version points to a different digest\n' "${registry}" "${channel}" >> "${decisions}"
                    echo "${channel_ref} already identifies ${STUDIO_VERSION} at ${current_digest}, not ${IMAGE_DIGEST}." >&2
                    exit 1
                  fi
                  printf '%s\t%s\tunchanged\talready points to %s\n' "${registry}" "${channel}" "${STUDIO_VERSION}" >> "${decisions}"
                  ;;
                behind)
                  printf '%s\t%s\tbehind\tkept newer version %s\n' "${registry}" "${channel}" "${current_version}" >> "${decisions}"
                  ;;
                *)
                  printf '%s\t%s\tfailed\tunknown comparison result\n' "${registry}" "${channel}" >> "${decisions}"
                  exit 1
                  ;;
              esac
            done
          done

      - name: Promote and verify selected channels
        if: steps.plan.outputs.mode != 'immutable-only'
        env:
          GHCR_IMAGE: ${{ steps.release.outputs.image }}
          DOCKERHUB_IMAGE: ${{ steps.release.outputs.dockerhub_image }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          decisions="${RUNNER_TEMP}/promotion-decisions.tsv"
          if [ ! -s "${RUNNER_TEMP}/promotion-channels-ghcr.txt" ] &&
            [ ! -s "${RUNNER_TEMP}/promotion-channels-dockerhub.txt" ]; then
            echo 'Every channel is already current or points to a newer release.'
            exit 0
          fi

          mark_decision() {
            local registry=$1 channel=$2 state=$3 detail=$4
            awk -F '\t' -v registry="${registry}" -v channel="${channel}" \
              -v state="${state}" -v detail="${detail}" '
                BEGIN { OFS = "\t" }
                $1 == registry && $2 == channel { $3 = state; $4 = detail }
                { print }
              ' "${decisions}" > "${decisions}.updated"
            mv "${decisions}.updated" "${decisions}"
          }

          for registry in ghcr dockerhub; do
            case "${registry}" in
              ghcr) image="${GHCR_IMAGE}" ;;
              dockerhub) image="${DOCKERHUB_IMAGE}" ;;
            esac
            promote_channels="${RUNNER_TEMP}/promotion-channels-${registry}.txt"
            if [ ! -s "${promote_channels}" ]; then continue; fi

            tag_args=()
            while IFS= read -r channel; do
              tag_args+=(--tag "${image}:${channel}")
            done < "${promote_channels}"
            docker buildx imagetools create "${tag_args[@]}" "${image}@${IMAGE_DIGEST}"

            # Registry tag reads may lag a successful push; verify with a bounded retry.
            while IFS= read -r channel; do
              channel_ref="${image}:${channel}"
              inspect_error="${RUNNER_TEMP}/promoted-${registry}-${channel//[^A-Za-z0-9]/-}.error"
              promoted_digest=''
              for attempt in {1..10}; do
                promoted_digest=''
                : > "${inspect_error}"
                if inspect_text=$(docker buildx imagetools inspect "${channel_ref}" 2> "${inspect_error}"); then
                  promoted_digest=$(awk '$1 == "Digest:" { print $2; exit }' <<< "${inspect_text}")
                  if [ "${promoted_digest}" = "${IMAGE_DIGEST}" ]; then
                    break
                  fi
                fi
                if [ "${attempt}" -lt 10 ]; then sleep 2; fi
              done
              if [ "${promoted_digest}" != "${IMAGE_DIGEST}" ]; then
                mark_decision "${registry}" "${channel}" failed 'digest did not converge'
                if [ -s "${inspect_error}" ]; then cat "${inspect_error}" >&2; fi
                echo "${channel_ref} did not converge to ${IMAGE_DIGEST}." >&2
                echo "Last observed digest: ${promoted_digest:-unavailable}." >&2
                exit 1
              fi
              mark_decision "${registry}" "${channel}" updated 'matches the immutable version digest'
            done < "${promote_channels}"
          done

      - name: Summarize channel promotion
        if: always()
        env:
          GHCR_IMAGE: ${{ steps.release.outputs.image }}
          DOCKERHUB_IMAGE: ${{ steps.release.outputs.dockerhub_image }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          DOCKERHUB_DIGEST: ${{ steps.image.outputs.dockerhub_digest }}
          JOB_STATUS: ${{ job.status }}
          PROMOTION_MODE: ${{ steps.plan.outputs.mode }}
          RELEASE_KIND: ${{ steps.release.outputs.kind }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
          STUDIO_VERSION: ${{ steps.release.outputs.version }}
          TARGET_SHA: ${{ steps.release.outputs.target_sha }}
        run: |
          {
            echo '## Studio image channel promotion'
            echo
            echo "- Result: \`${JOB_STATUS}\`"
            if [ -n "${STUDIO_VERSION}" ]; then
              echo "- Version: \`${STUDIO_VERSION}\` (${RELEASE_KIND})"
              echo "- Source commit: \`${TARGET_SHA}\`"
              echo "- GHCR image: \`${GHCR_IMAGE}:${STUDIO_VERSION}@${IMAGE_DIGEST}\`"
              echo "- Docker Hub image: \`${DOCKERHUB_IMAGE}:${STUDIO_VERSION}@${DOCKERHUB_DIGEST}\`"
              echo "- Release: ${RELEASE_URL}"
              if [ "${PROMOTION_MODE}" = immutable-only ]; then
                echo '- Channel promotion: `immutable-only` (no mutable channels apply).'
              fi
            fi
            decisions="${RUNNER_TEMP}/promotion-decisions.tsv"
            if [ -s "${decisions}" ]; then
              echo
              echo '| Registry | Channel | Decision | Detail |'
              echo '| --- | --- | --- | --- |'
              while IFS=$'\t' read -r registry channel decision detail; do
                echo "| \`${registry}\` | \`${channel}\` | \`${decision}\` | ${detail} |"
              done < "${decisions}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
