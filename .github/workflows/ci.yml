name: CI

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact commit to test when CI is called by another workflow
        required: false
        default: ''
        type: string
  pull_request:
  push:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  HUSKY: 0
  NODE_VERSION: '24.21.0'
  SOURCE_SHA: ${{ inputs.checkout_ref || github.sha }}
  SOURCE_REF: ${{ inputs.checkout_ref || github.ref_name }}

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Test the release channel policy
        run: pnpm test:release-policy

      - name: Lint repository
        run: pnpm lint

      - name: Typecheck workspaces
        run: pnpm -r --if-present lint:types

      - name: Reject generated or lockfile drift
        run: git diff --exit-code

  frontend-and-packages:
    name: Frontend and packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend and package tests
        run: pnpm test

      - name: Build workspace apps
        run: |
          pnpm build
          pnpm build:gui

      - name: Smoke test the workspace apps
        run: |
          pnpm --dir apps/gui preview --host 127.0.0.1 --port 4173 &
          preview_pid=$!
          trap 'kill "${preview_pid}" || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ui/console >/dev/null; then
              break
            fi
            if [ "${attempt}" -eq 20 ]; then
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          kill "${preview_pid}"
          wait "${preview_pid}" || true
          trap - EXIT

      - name: Reject tracked build drift
        run: git diff --exit-code

  go-server:
    name: Go Server
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum

      - name: Test all Server packages
        run: go test ./...

      - name: Compile the Studio Server
        run: go build -trimpath -o "${RUNNER_TEMP}/studio" .

      - name: Install the pinned generator
        run: go install github.com/golang/mock/mockgen@v1.6.0

      - name: Verify generated Go sources
        run: |
          go generate ./...
          git diff --exit-code

  studio-archives:
    name: Studio Linux archives
    uses: ./.github/workflows/studio-archives.yml
    with:
      version: 0.0.0-dev+${{ inputs.checkout_ref || github.sha }}
      git_hash: ${{ inputs.checkout_ref || github.sha }}
      git_ref: ${{ inputs.checkout_ref || github.ref_name }}
      artifact_suffix: ci
    permissions:
      contents: read

  native-docker-delivery:
    name: Native Docker delivery (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            machine: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Require the expected native architecture
        run: test "$(uname -m)" = '${{ matrix.machine }}'

      - name: Build and run the native Docker image
        run: |
          image="nebula-studio:ci-${{ matrix.arch }}"
          container="studio-ci-${{ matrix.arch }}"
          docker buildx build \
            --platform 'linux/${{ matrix.arch }}' \
            --build-arg "STUDIO_VERSION=0.0.0-dev+${SOURCE_SHA}" \
            --build-arg "GIT_HASH=${SOURCE_SHA}" \
            --build-arg "GIT_REF=${SOURCE_REF}" \
            --load \
            --tag "${image}" \
            .
          docker run --detach --rm \
            --name "${container}" \
            --publish 127.0.0.1:17001:7001 \
            --health-interval 1s \
            --health-start-period 1s \
            --health-timeout 2s \
            --health-retries 20 \
            "${image}"
          trap 'docker logs "${container}" || true; docker stop --timeout 10 "${container}" || true' EXIT
          for attempt in {1..30}; do
            health_state=$(docker inspect --format '{{.State.Health.Status}}' "${container}")
            if [ "${health_state}" = healthy ]; then
              break
            fi
            if [ "${attempt}" -eq 30 ]; then
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:17001/api-studio/db/oauth2-config | grep -Fq '"enabled":false'
          docker exec "${container}" ./studio -v | grep -F "V0.0.0-dev+${SOURCE_SHA}"
          docker exec "${container}" /usr/bin/id -u | grep -Fx 10001
          docker stop --timeout 10 "${container}"
          trap - EXIT

  public-ci:
    name: Public CI gate
    if: always()
    needs:
      - repository-checks
      - frontend-and-packages
      - go-server
      - studio-archives
      - native-docker-delivery
    runs-on: ubuntu-24.04
    steps:
      - name: Require every public check
        env:
          REPOSITORY_RESULT: ${{ needs.repository-checks.result }}
          FRONTEND_RESULT: ${{ needs.frontend-and-packages.result }}
          GO_RESULT: ${{ needs.go-server.result }}
          ARCHIVE_RESULT: ${{ needs.studio-archives.result }}
          NATIVE_DOCKER_RESULT: ${{ needs.native-docker-delivery.result }}
        run: |
          for check_result in \
            "${REPOSITORY_RESULT}" \
            "${FRONTEND_RESULT}" \
            "${GO_RESULT}" \
            "${ARCHIVE_RESULT}" \
            "${NATIVE_DOCKER_RESULT}"; do
            test "${check_result}" = success
          done
