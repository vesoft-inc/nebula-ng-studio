name: Release Studio

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Commit, tag, or branch to release. Leave empty to release the dispatched ref.
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: studio-release-channels
  cancel-in-progress: false

env:
  CI: true
  HUSKY: 0
  STUDIO_IMAGE: ghcr.io/${{ github.repository_owner }}/nebula-studio

jobs:
  preflight:
    name: Validate release request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      studio_version: ${{ steps.request.outputs.studio_version }}
      tag_name: ${{ steps.request.outputs.tag_name }}
      target_sha: ${{ steps.request.outputs.target_sha }}
      release_source: ${{ steps.request.outputs.release_source }}
      is_prerelease: ${{ steps.request.outputs.is_prerelease }}
      is_stable: ${{ steps.request.outputs.is_stable }}
      image: ${{ steps.request.outputs.image }}
      release_state: ${{ steps.request.outputs.release_state }}
      tag_exists: ${{ steps.request.outputs.tag_exists }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve the immutable release request
        id: request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REF: ${{ inputs.target_ref }}
          DISPATCH_REF: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # An empty input releases the ref the workflow was dispatched from: pick the branch or tag
          # above, leave the box empty. Any ref of the repository can be released.
          target_ref="${TARGET_REF:-${DISPATCH_REF}}"
          [[ "${target_ref}" =~ ^[A-Za-z0-9][A-Za-z0-9._/@+-]{0,254}$ ]] || {
            echo "Target ref '${target_ref}' must be a branch, tag, or commit of the repository." >&2
            exit 1
          }

          git fetch --force --tags origin '+refs/heads/*:refs/remotes/origin/*'

          # A plain branch name resolves through the fetched remote-tracking ref.
          resolve_commit() {
            git rev-parse --verify --quiet "${1}^{commit}" && return 0
            git rev-parse --verify --quiet "origin/${1}^{commit}" && return 0
            return 1
          }
          target_sha=$(resolve_commit "${target_ref}") || {
            echo "Target ref '${target_ref}' does not resolve to a commit of this repository." >&2
            exit 1
          }

          # Informational only: the approval preview names what is released and whether the commit is
          # already on the default branch. Nothing here blocks a release.
          default_sha=$(git rev-parse --verify --quiet "origin/${DEFAULT_BRANCH}^{commit}") || true
          if [ -n "${default_sha}" ] && git merge-base --is-ancestor "${target_sha}" "${default_sha}"; then
            release_source="${DEFAULT_BRANCH}"
          else
            release_source="${target_ref} (not on ${DEFAULT_BRANCH})"
          fi
          echo "::notice::Releasing ${target_sha} for ${release_source}."

          # The version is authored in the Web manifest of the released commit, so a release never
          # restates it: bump apps/web/package.json in the commit that is being released.
          manifest="apps/web/package.json"
          studio_version=""
          if git cat-file -e "${target_sha}:${manifest}" 2>/dev/null; then
            studio_version=$(git show "${target_sha}:${manifest}" | jq -r '.version // empty') || {
              echo "${manifest} at ${target_sha} is not readable as JSON." >&2
              exit 1
            }
          fi
          [[ "${studio_version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(rc|beta)\.(0|[1-9][0-9]*))?$ ]] || {
            echo "${manifest} at ${target_sha} declares '${studio_version}', which is not a releasable X.Y.Z or X.Y.Z-(rc|beta).N version." >&2
            exit 1
          }
          if [[ "${studio_version}" == *-* ]]; then
            is_prerelease=true
            is_stable=false
          else
            is_prerelease=false
            is_stable=true
          fi

          release_kind=stable
          if [ "${is_prerelease}" = true ]; then
            release_kind=prerelease
          fi
          echo "::notice::Releasing ${studio_version} (${release_kind}) from ${manifest} at ${target_sha}."

          tag_name="v${studio_version}"
          tag_exists=false
          if git show-ref --verify --quiet "refs/tags/${tag_name}"; then
            test "$(git cat-file -t "refs/tags/${tag_name}")" = tag || {
              echo "Existing ${tag_name} is not an annotated tag." >&2
              exit 1
            }
            test "$(git rev-list -n 1 "refs/tags/${tag_name}")" = "${target_sha}" || {
              echo "Existing ${tag_name} points to another commit." >&2
              exit 1
            }
            tag_exists=true
          fi

          fetch_release() {
            local release release_id
            if ! release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag_name}" 2>/dev/null); then
              release_id=$(gh release view "${tag_name}" --repo "${GITHUB_REPOSITORY}" --json databaseId --jq .databaseId 2>/dev/null || true)
              if [ -n "${release_id}" ]; then
                release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}")
              else
                release=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" |
                  jq -s --arg tag "${tag_name}" --arg name "NebulaGraph Studio ${studio_version}" '
                    map(select(type == "array")) | add // []
                    | map(select(.tag_name == $tag or (.draft == true and .name == $name)))
                    | if length == 1 then .[0] else empty end') || return 1
              fi
            fi
            test -n "${release}" || return 1
            jq -e 'type == "object"' <<< "${release}" >/dev/null || return 1
            printf '%s\n' "${release}"
          }

          release_state=absent
          release_json="${RUNNER_TEMP}/existing-release.json"
          if fetch_release > "${release_json}"; then
            test "${tag_exists}" = true || {
              echo "Release ${tag_name} exists without the required annotated tag." >&2
              exit 1
            }
            if jq -e '.draft == true' "${release_json}" >/dev/null; then
              release_state=draft
            else
              release_state=published
              jq -e --argjson expected "${is_prerelease}" '.prerelease == $expected' "${release_json}" >/dev/null || {
                echo "Published release prerelease state conflicts with the requested version." >&2
                exit 1
              }
            fi
          fi

          image=$(printf '%s' "${STUDIO_IMAGE}" | tr '[:upper:]' '[:lower:]')
          [[ "${image}" =~ ^ghcr\.io/[a-z0-9._-]+/nebula-studio$ ]]

          {
            echo "studio_version=${studio_version}"
            echo "tag_name=${tag_name}"
            echo "target_sha=${target_sha}"
            echo "release_source=${release_source}"
            echo "is_prerelease=${is_prerelease}"
            echo "is_stable=${is_stable}"
            echo "image=${image}"
            echo "release_state=${release_state}"
            echo "tag_exists=${tag_exists}"
          } >> "${GITHUB_OUTPUT}"

  quality-gate:
    name: Public CI quality gate
    needs: preflight
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: ${{ needs.preflight.outputs.target_sha }}
    permissions:
      contents: read

  release-archives:
    name: Release Linux archives
    needs:
      - preflight
      - quality-gate
    uses: ./.github/workflows/studio-archives.yml
    with:
      version: ${{ needs.preflight.outputs.studio_version }}
      git_hash: ${{ needs.preflight.outputs.target_sha }}
      git_ref: ${{ needs.preflight.outputs.tag_name }}
      artifact_suffix: release
    permissions:
      contents: read

  release-candidate:
    name: Review release candidate
    needs:
      - preflight
      - release-archives
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: studio-linux-*-release
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      - name: Verify artifacts and publish the approval preview
        env:
          STUDIO_VERSION: ${{ needs.preflight.outputs.studio_version }}
          TAG_NAME: ${{ needs.preflight.outputs.tag_name }}
          TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
          IS_PRERELEASE: ${{ needs.preflight.outputs.is_prerelease }}
          IMAGE: ${{ needs.preflight.outputs.image }}
          RELEASE_STATE: ${{ needs.preflight.outputs.release_state }}
          TAG_EXISTS: ${{ needs.preflight.outputs.tag_exists }}
          RELEASE_SOURCE: ${{ needs.preflight.outputs.release_source }}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/release-assets"
          for architecture in amd64 arm64; do
            archive="nebula-studio-${STUDIO_VERSION}-linux-${architecture}.tar.gz"
            test -f "${archive}"
            test -f "${archive}.sha256"
            sha256sum --check "${archive}.sha256"
          done
          test "$(find . -maxdepth 1 -type f | wc -l | tr -d ' ')" = 4

          if [ "${IS_PRERELEASE}" = true ]; then
            release_kind=prerelease
          else
            release_kind=stable
          fi
          {
            echo '## Studio release approval preview'
            echo
            echo "- Version: \`${STUDIO_VERSION}\` (${release_kind})"
            echo '- Version source: `apps/web/package.json` at the target commit'
            echo "- Annotated tag: \`${TAG_NAME}\` (already exists: \`${TAG_EXISTS}\`)"
            echo "- Source commit: \`${TARGET_SHA}\`"
            echo "- Release source: \`${RELEASE_SOURCE}\`"
            echo "- OCI image: \`${IMAGE}:${STUDIO_VERSION}\`"
            echo "- Existing Release state: \`${RELEASE_STATE}\`"
            echo '- Linux archives: `amd64`, `arm64`'
            for checksum_file in ./*.sha256; do
              echo "- Checksum: \`$(cat "${checksum_file}")\`"
            done
            echo
            echo 'The publish job requires approval from the protected `release` environment; it leaves the Release as a draft. Publish the draft manually, then re-run this workflow with the same target to move the stable channels.'
          } >> "${GITHUB_STEP_SUMMARY}"

  publish:
    name: Publish approved Studio release
    needs:
      - preflight
      - release-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: release
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.target_sha }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: studio-linux-*-release
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or verify the annotated tag
        env:
          TAG_NAME: ${{ needs.preflight.outputs.tag_name }}
          TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
          STUDIO_VERSION: ${{ needs.preflight.outputs.studio_version }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          if git show-ref --verify --quiet "refs/tags/${TAG_NAME}"; then
            test "$(git cat-file -t "refs/tags/${TAG_NAME}")" = tag
            test "$(git rev-list -n 1 "refs/tags/${TAG_NAME}")" = "${TARGET_SHA}"
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag --annotate "${TAG_NAME}" "${TARGET_SHA}" --message "NebulaGraph Studio ${STUDIO_VERSION}"
            git push origin "refs/tags/${TAG_NAME}"
          fi
          test "$(git rev-list -n 1 "refs/tags/${TAG_NAME}")" = "${TARGET_SHA}"

      - name: Generate OCI metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        with:
          images: ${{ needs.preflight.outputs.image }}
          flavor: latest=false
          tags: type=raw,value=${{ needs.preflight.outputs.studio_version }}
          labels: |
            org.opencontainers.image.title=NebulaGraph Studio
            org.opencontainers.image.description=Self-hosted NebulaGraph Studio with integrated Explorer
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.preflight.outputs.studio_version }}
            org.opencontainers.image.revision=${{ needs.preflight.outputs.target_sha }}
          annotations: |
            org.opencontainers.image.title=NebulaGraph Studio
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.preflight.outputs.studio_version }}
            org.opencontainers.image.revision=${{ needs.preflight.outputs.target_sha }}

      - name: Inspect an existing immutable version image
        id: image-state
        env:
          IMAGE: ${{ needs.preflight.outputs.image }}
          STUDIO_VERSION: ${{ needs.preflight.outputs.studio_version }}
          TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
        run: |
          set -euo pipefail
          image_ref="${IMAGE}:${STUDIO_VERSION}"
          if docker buildx imagetools inspect "${image_ref}" > "${RUNNER_TEMP}/image.txt" 2> "${RUNNER_TEMP}/image-error.txt"; then
            docker buildx imagetools inspect "${image_ref}" --raw > "${RUNNER_TEMP}/image.json"
            revision=$(jq -r '.annotations["org.opencontainers.image.revision"] // empty' "${RUNNER_TEMP}/image.json")
            test "${revision}" = "${TARGET_SHA}" || {
              echo "${image_ref} already exists with revision ${revision:-missing}." >&2
              exit 1
            }
            digest=$(awk '$1 == "Digest:" { print $2; exit }' "${RUNNER_TEMP}/image.txt")
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo 'exists=true' >> "${GITHUB_OUTPUT}"
            echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          elif grep -Eqi 'not found|manifest unknown' "${RUNNER_TEMP}/image-error.txt"; then
            echo 'exists=false' >> "${GITHUB_OUTPUT}"
          else
            cat "${RUNNER_TEMP}/image-error.txt" >&2
            exit 1
          fi

      - name: Build and push the immutable version image
        id: push-image
        if: steps.image-state.outputs.exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          build-args: |
            STUDIO_VERSION=${{ needs.preflight.outputs.studio_version }}
            GIT_HASH=${{ needs.preflight.outputs.target_sha }}
            GIT_REF=${{ needs.preflight.outputs.tag_name }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            LICENSES=Apache-2.0
          cache-from: type=gha,scope=studio-release
          cache-to: type=gha,mode=max,scope=studio-release

      - name: Resolve the immutable image digest
        id: image
        env:
          IMAGE_EXISTS: ${{ steps.image-state.outputs.exists }}
          EXISTING_DIGEST: ${{ steps.image-state.outputs.digest }}
          PUSHED_DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          set -euo pipefail
          if [ "${IMAGE_EXISTS}" = true ]; then
            digest="${EXISTING_DIGEST}"
          else
            digest="${PUSHED_DIGEST}"
          fi
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Create or reuse the GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.preflight.outputs.tag_name }}
          STUDIO_VERSION: ${{ needs.preflight.outputs.studio_version }}
          TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
          IS_PRERELEASE: ${{ needs.preflight.outputs.is_prerelease }}
          IMAGE: ${{ needs.preflight.outputs.image }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          fetch_release() {
            local release release_id
            if ! release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}" 2>/dev/null); then
              release_id=$(gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" --json databaseId --jq .databaseId 2>/dev/null || true)
              if [ -n "${release_id}" ]; then
                release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}")
              else
                release=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" |
                  jq -s --arg tag "${TAG_NAME}" --arg name "NebulaGraph Studio ${STUDIO_VERSION}" '
                    map(select(type == "array")) | add // []
                    | map(select(.tag_name == $tag or (.draft == true and .name == $name)))
                    | if length == 1 then .[0] else empty end') || return 1
              fi
            fi
            test -n "${release}" || return 1
            jq -e 'type == "object"' <<< "${release}" >/dev/null || return 1
            printf '%s\n' "${release}"
          }

          release_json="${RUNNER_TEMP}/release.json"
          if ! fetch_release > "${release_json}"; then
            release_args=(--draft --verify-tag --title "NebulaGraph Studio ${STUDIO_VERSION}" --notes 'Release notes are being prepared.')
            if [ "${IS_PRERELEASE}" = true ]; then
              release_args+=(--prerelease)
            fi
            gh release create "${TAG_NAME}" "${release_args[@]}"
            fetch_release > "${release_json}"
          fi

          release_id=$(jq -r .id "${release_json}")
          draft=$(jq -r .draft "${release_json}")
          if [ "${draft}" = true ]; then
            notes="${RUNNER_TEMP}/release-notes.md"
            prev_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude 'v*-*' "${TARGET_SHA}^" 2>/dev/null || true)
            {
              echo '## Changes'
              echo
              if [ -n "${prev_tag}" ]; then
                range="${prev_tag}..${TARGET_SHA}"
              else
                range="${TARGET_SHA}"
              fi
              git log --no-merges --pretty=format:'%h%x09%s' "${range}" |
                awk -F'\t' -v repo="${GITHUB_REPOSITORY}" '
                  function section(subject) {
                    if (subject ~ /^feat(\(|:|!)/) return "Features"
                    if (subject ~ /^fix(\(|:|!)/) return "Fixes"
                    return "Other Changes"
                  }
                  $2 ~ /^chore\(release\)/ { next }
                  {
                    name = section($2)
                    items[name] = items[name] "- " $2 " ([" $1 "](https://github.com/" repo "/commit/" $1 "))\n"
                  }
                  END {
                    split("Features Fixes Other Changes", order, " ")
                    printed = 0
                    for (i = 1; i <= 3; i++) {
                      if (order[i] in items) {
                        printf "### %s\n%s\n", order[i], items[order[i]]
                        printed = 1
                      }
                    }
                    if (!printed) print "- No user-visible changes recorded in this range."
                  }
                '
              if [ -n "${prev_tag}" ]; then
                echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev_tag}...${TAG_NAME}"
              else
                echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/commits/${TAG_NAME}"
              fi
              echo
              echo '## Delivery metadata'
              echo
              echo "- Version: \`${STUDIO_VERSION}\`"
              echo "- Source commit: \`${TARGET_SHA}\`"
              echo "- OCI image: \`${IMAGE}:${STUDIO_VERSION}@${IMAGE_DIGEST}\`"
              echo '- Linux archives: `amd64`, `arm64` (SHA-256 files attached)'
              echo '- Upgrade note: back up the Studio database before deployment.'
            } > "${notes}"
            jq -n \
              --arg name "NebulaGraph Studio ${STUDIO_VERSION}" \
              --rawfile body "${notes}" \
              --argjson prerelease "${IS_PRERELEASE}" \
              '{name: $name, body: $body, draft: true, prerelease: $prerelease}' \
              > "${RUNNER_TEMP}/release-update.json"
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              --input "${RUNNER_TEMP}/release-update.json" >/dev/null
          else
            jq -e --argjson expected "${IS_PRERELEASE}" '.prerelease == $expected' "${release_json}" >/dev/null
          fi

          echo "id=${release_id}" >> "${GITHUB_OUTPUT}"
          echo "draft=${draft}" >> "${GITHUB_OUTPUT}"

      - name: Reuse or upload verified Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STUDIO_VERSION: ${{ needs.preflight.outputs.studio_version }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
          RELEASE_DRAFT: ${{ steps.release.outputs.draft }}
        run: |
          set -euo pipefail
          assets_root="${RUNNER_TEMP}/release-assets"
          release_json="${RUNNER_TEMP}/release-assets.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > "${release_json}"

          expected_assets=(
            "nebula-studio-${STUDIO_VERSION}-linux-amd64.tar.gz"
            "nebula-studio-${STUDIO_VERSION}-linux-amd64.tar.gz.sha256"
            "nebula-studio-${STUDIO_VERSION}-linux-arm64.tar.gz"
            "nebula-studio-${STUDIO_VERSION}-linux-arm64.tar.gz.sha256"
          )
          for asset_name in "${expected_assets[@]}"; do
            local_path="${assets_root}/${asset_name}"
            test -f "${local_path}"
            count=$(jq --arg name "${asset_name}" '[.assets[] | select(.name == $name)] | length' "${release_json}")
            test "${count}" -le 1
            asset_id=$(jq -r --arg name "${asset_name}" '[.assets[] | select(.name == $name)][0].id // empty' "${release_json}")
            if [ -n "${asset_id}" ]; then
              remote_path="${RUNNER_TEMP}/remote-${asset_name}"
              gh api \
                -H 'Accept: application/octet-stream' \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > "${remote_path}"
              test "$(sha256sum "${local_path}" | cut -d ' ' -f 1)" = "$(sha256sum "${remote_path}" | cut -d ' ' -f 1)" || {
                echo "Existing asset ${asset_name} has different content." >&2
                exit 1
              }
              echo "Reusing ${asset_name}."
            else
              test "${RELEASE_DRAFT}" = true || {
                echo "Published Release is missing ${asset_name}; immutable assets will not be modified." >&2
                exit 1
              }
              curl --fail --silent --show-error \
                --request POST \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header 'Content-Type: application/octet-stream' \
                --data-binary "@${local_path}" \
                "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${asset_name}"
            fi
          done

          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > "${release_json}"
          jq -e --arg version "${STUDIO_VERSION}" '
            ([.assets[].name] | sort) ==
            ([
              "nebula-studio-\($version)-linux-amd64.tar.gz",
              "nebula-studio-\($version)-linux-amd64.tar.gz.sha256",
              "nebula-studio-\($version)-linux-arm64.tar.gz",
              "nebula-studio-\($version)-linux-arm64.tar.gz.sha256"
            ] | sort)
          ' "${release_json}" >/dev/null

      - name: Leave the draft for review or verify the published Release
        id: release-state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.preflight.outputs.tag_name }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
          RELEASE_DRAFT: ${{ steps.release.outputs.draft }}
        run: |
          set -euo pipefail
          if [ "${RELEASE_DRAFT}" = true ]; then
            echo 'published=false' >> "${GITHUB_OUTPUT}"
            echo "::notice::${TAG_NAME} stays a draft. Review the release notes, publish the Release in the GitHub UI, then re-run this workflow with the same target to move the stable channels."
            echo "Draft ready for review: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/edit/${TAG_NAME}"
            exit 0
          fi
          echo 'published=true' >> "${GITHUB_OUTPUT}"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            --jq 'select(.draft == false) | .html_url'

      - name: Update stable OCI channels last
        if: needs.preflight.outputs.is_stable == 'true' && steps.release-state.outputs.published == 'true'
        env:
          IMAGE: ${{ needs.preflight.outputs.image }}
          STUDIO_VERSION: ${{ needs.preflight.outputs.studio_version }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          IFS=. read -r major minor patch <<< "${STUDIO_VERSION}"
          test -n "${major}" && test -n "${minor}" && test -n "${patch}"
          channels=("${major}.${minor}" "${major}" latest)
          tag_args=()
          for channel in "${channels[@]}"; do
            tag_args+=(--tag "${IMAGE}:${channel}")
          done
          docker buildx imagetools create "${tag_args[@]}" "${IMAGE}@${IMAGE_DIGEST}"
          for channel in "${channels[@]}"; do
            channel_digest=$(docker buildx imagetools inspect "${IMAGE}:${channel}" | awk '$1 == "Digest:" { print $2; exit }')
            test "${channel_digest}" = "${IMAGE_DIGEST}"
          done

      - name: Summarize the release state
        env:
          STUDIO_VERSION: ${{ needs.preflight.outputs.studio_version }}
          TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
          TAG_NAME: ${{ needs.preflight.outputs.tag_name }}
          IMAGE: ${{ needs.preflight.outputs.image }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IS_STABLE: ${{ needs.preflight.outputs.is_stable }}
          PUBLISHED: ${{ steps.release-state.outputs.published }}
        run: |
          {
            if [ "${PUBLISHED}" = true ]; then
              echo '## Studio release published'
            else
              echo '## Studio release draft prepared'
            fi
            echo
            echo "- Version: \`${STUDIO_VERSION}\`"
            echo "- Source: \`${TARGET_SHA}\`"
            echo "- Image: \`${IMAGE}:${STUDIO_VERSION}@${IMAGE_DIGEST}\`"
            if [ "${PUBLISHED}" = true ]; then
              echo "- Stable channels updated: \`${IS_STABLE}\`"
            else
              echo '- Stable channels updated: `false` (draft)'
              echo '- Next: review and publish the draft Release, then re-run this workflow with the same target to move the stable channels.'
              echo "- Draft: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/edit/${TAG_NAME}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
