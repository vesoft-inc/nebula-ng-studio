name: Release Studio

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Commit, tag, or branch to release. Leave empty to release the dispatched ref.
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: studio-release-channels
  cancel-in-progress: false

env:
  CI: true
  HUSKY: 0
  NODE_VERSION: '24.21.0'
  STUDIO_IMAGE: ghcr.io/${{ github.repository_owner }}/nebula-studio

jobs:
  preflight:
    name: Validate release request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      studio_version: ${{ steps.request.outputs.studio_version }}
      tag_name: ${{ steps.request.outputs.tag_name }}
      target_sha: ${{ steps.request.outputs.target_sha }}
      release_source: ${{ steps.request.outputs.release_source }}
      is_prerelease: ${{ steps.request.outputs.is_prerelease }}
      release_kind: ${{ steps.request.outputs.release_kind }}
      image: ${{ steps.request.outputs.image }}
      release_state: ${{ steps.request.outputs.release_state }}
      tag_exists: ${{ steps.request.outputs.tag_exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install the release policy dependency
        run: pnpm install --filter nebula-ng-studio-workspace --frozen-lockfile --ignore-scripts

      - name: Resolve the immutable release request
        id: request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REF: ${{ inputs.target_ref }}
          DISPATCH_REF: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # An empty input releases the ref the workflow was dispatched from: pick the branch or tag
          # above, leave the box empty. Any ref of the repository can be released.
          target_ref="${TARGET_REF:-${DISPATCH_REF}}"
          [[ "${target_ref}" =~ ^[A-Za-z0-9][A-Za-z0-9._/@+-]{0,254}$ ]] || {
            echo "Target ref '${target_ref}' must be a branch, tag, or commit of the repository." >&2
            exit 1
          }

          git fetch --force --tags origin '+refs/heads/*:refs/remotes/origin/*'

          # A plain branch name resolves through the fetched remote-tracking ref.
          resolve_commit() {
            git rev-parse --verify --quiet "${1}^{commit}" && return 0
            git rev-parse --verify --quiet "origin/${1}^{commit}" && return 0
            return 1
          }
          target_sha=$(resolve_commit "${target_ref}") || {
            echo "Target ref '${target_ref}' does not resolve to a commit of this repository." >&2
            exit 1
          }

          # Informational only: the approval preview names what is released and whether the commit is
          # already on the default branch. Nothing here blocks a release.
          default_sha=$(git rev-parse --verify --quiet "origin/${DEFAULT_BRANCH}^{commit}") || true
          if [ -n "${default_sha}" ] && git merge-base --is-ancestor "${target_sha}" "${default_sha}"; then
            release_source="${DEFAULT_BRANCH}"
          else
            release_source="${target_ref} (not on ${DEFAULT_BRANCH})"
          fi
          echo "::notice::Releasing ${target_sha} for ${release_source}."

          # The version is authored in the Web manifest of the released commit, so a release never
          # restates it: bump apps/web/package.json in the commit that is being released.
          manifest="apps/web/package.json"
          studio_version=""
          if git cat-file -e "${target_sha}:${manifest}" 2>/dev/null; then
            studio_version=$(git show "${target_sha}:${manifest}" | jq -r '.version // empty') || {
              echo "${manifest} at ${target_sha} is not readable as JSON." >&2
              exit 1
            }
          fi
          policy_json=$(node scripts/release-channel-policy.mjs classify "${studio_version}")
          is_prerelease=$(jq -r .isPrerelease <<< "${policy_json}")
          release_kind=$(jq -r .kind <<< "${policy_json}")
          echo "::notice::Releasing ${studio_version} (${release_kind}) from ${manifest} at ${target_sha}."

          tag_name="v${studio_version}"
          tag_exists=false
          if git show-ref --verify --quiet "refs/tags/${tag_name}"; then
            test "$(git cat-file -t "refs/tags/${tag_name}")" = tag || {
              echo "Existing ${tag_name} is not an annotated tag." >&2
              exit 1
            }
            test "$(git rev-list -n 1 "refs/tags/${tag_name}")" = "${target_sha}" || {
              echo "Existing ${tag_name} points to another commit." >&2
              exit 1
            }
            tag_exists=true
          fi

          fetch_release() {
            local release release_id
            if ! release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag_name}" 2>/dev/null); then
              release_id=$(gh release view "${tag_name}" --repo "${GITHUB_REPOSITORY}" --json databaseId --jq .databaseId 2>/dev/null || true)
              if [ -n "${release_id}" ]; then
                release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}")
              else
                release=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" |
                  jq -s --arg tag "${tag_name}" --arg name "NebulaGraph Studio ${studio_version}" '
                    map(select(type == "array")) | add // []
                    | map(select(.tag_name == $tag or (.draft == true and .name == $name)))
                    | if length == 1 then .[0] else empty end') || return 1
              fi
            fi
            test -n "${release}" || return 1
            jq -e 'type == "object"' <<< "${release}" >/dev/null || return 1
            printf '%s\n' "${release}"
          }

          release_state=absent
          release_json="${RUNNER_TEMP}/existing-release.json"
          if fetch_release > "${release_json}"; then
            test "${tag_exists}" = true || {
              echo "Release ${tag_name} exists without the required annotated tag." >&2
              exit 1
            }
            jq -e --arg tag "${tag_name}" '.tag_name == $tag' "${release_json}" >/dev/null || {
              echo "Existing Release is bound to a different tag than ${tag_name}." >&2
              exit 1
            }
            if jq -e '.draft == true' "${release_json}" >/dev/null; then
              jq -e --arg target "${target_sha}" '.target_commitish == $target' "${release_json}" >/dev/null || {
                echo "Existing draft Release targets a different commit than ${target_sha}." >&2
                exit 1
              }
            fi
            jq -e --argjson expected "${is_prerelease}" '.prerelease == $expected' "${release_json}" >/dev/null || {
              echo "Release prerelease state conflicts with the requested version." >&2
              exit 1
            }
            if jq -e '.draft == true' "${release_json}" >/dev/null; then
              release_state=draft
            else
              release_state=published
            fi
          fi

          image=$(printf '%s' "${STUDIO_IMAGE}" | tr '[:upper:]' '[:lower:]')
          [[ "${image}" =~ ^ghcr\.io/[a-z0-9._-]+/nebula-studio$ ]]

          {
            echo "studio_version=${studio_version}"
            echo "tag_name=${tag_name}"
            echo "target_sha=${target_sha}"
            echo "release_source=${release_source}"
            echo "is_prerelease=${is_prerelease}"
            echo "release_kind=${release_kind}"
            echo "image=${image}"
            echo "release_state=${release_state}"
            echo "tag_exists=${tag_exists}"
          } >> "${GITHUB_OUTPUT}"

  quality-gate:
    name: Public CI quality gate
    needs: preflight
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: ${{ needs.preflight.outputs.target_sha }}
      release_version: ${{ needs.preflight.outputs.studio_version }}
    permissions:
      contents: read

  release-candidate:
    name: Review release candidate
    needs:
      - preflight
      - quality-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: studio-linux-*-release
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      - name: Verify artifacts and publish the approval preview
        env:
          STUDIO_VERSION: ${{ needs.preflight.outputs.studio_version }}
          TAG_NAME: ${{ needs.preflight.outputs.tag_name }}
          TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
          RELEASE_KIND: ${{ needs.preflight.outputs.release_kind }}
          IMAGE: ${{ needs.preflight.outputs.image }}
          RELEASE_STATE: ${{ needs.preflight.outputs.release_state }}
          TAG_EXISTS: ${{ needs.preflight.outputs.tag_exists }}
          RELEASE_SOURCE: ${{ needs.preflight.outputs.release_source }}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/release-assets"
          test -f assets-amd64.txt
          test -f assets-arm64.txt
          cat assets-amd64.txt assets-arm64.txt | sort -u > expected-assets.txt
          test "$(wc -l < expected-assets.txt | tr -d ' ')" = 12
          while IFS= read -r asset; do
            test -f "${asset}"
          done < expected-assets.txt
          while IFS= read -r checksum; do
            sha256sum --check "${checksum}"
          done < <(grep -E '\.sha256$' expected-assets.txt)
          test "$(find . -maxdepth 1 -type f ! -name 'assets-*.txt' ! -name expected-assets.txt | wc -l | tr -d ' ')" = 12

          {
            echo '## Studio release approval preview'
            echo
            echo "- Version: \`${STUDIO_VERSION}\` (${RELEASE_KIND})"
            echo '- Version source: `apps/web/package.json` at the target commit'
            echo "- Annotated tag: \`${TAG_NAME}\` (already exists: \`${TAG_EXISTS}\`)"
            echo "- Source commit: \`${TARGET_SHA}\`"
            echo "- Release source: \`${RELEASE_SOURCE}\`"
            echo "- OCI image: \`${IMAGE}:${STUDIO_VERSION}\`"
            echo "- Existing Release state: \`${RELEASE_STATE}\`"
            echo '- Linux delivery: tar.gz, DEB and RPM for `amd64` and `arm64`'
            echo '- Source downloads: GitHub-generated `Source code (zip)` and `Source code (tar.gz)` for the annotated tag'
            while IFS= read -r checksum_file; do
              echo "- Checksum: \`$(cat "${checksum_file}")\`"
            done < <(grep -E '\.sha256$' expected-assets.txt)
            echo
            echo 'The publish job runs in the `release` environment and leaves the GitHub Release as a draft for review.'
            echo 'Publishing the draft in GitHub automatically promotes the immutable image digest to the applicable channels.'
          } >> "${GITHUB_STEP_SUMMARY}"

  publish-prepare:
    name: Approve and prepare Studio publication
    needs:
      - preflight
      - release-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: release
    outputs:
      image_exists: ${{ steps.image-state.outputs.exists }}
      image_digest: ${{ steps.image-state.outputs.digest }}
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.target_sha }}
          fetch-depth: 0
          fetch-tags: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or verify the annotated tag
        env:
          TAG_NAME: ${{ needs.preflight.outputs.tag_name }}
          TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
          STUDIO_VERSION: ${{ needs.preflight.outputs.studio_version }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          if git show-ref --verify --quiet "refs/tags/${TAG_NAME}"; then
            test "$(git cat-file -t "refs/tags/${TAG_NAME}")" = tag
            test "$(git rev-list -n 1 "refs/tags/${TAG_NAME}")" = "${TARGET_SHA}"
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag --annotate "${TAG_NAME}" "${TARGET_SHA}" --message "NebulaGraph Studio ${STUDIO_VERSION}"
            git push origin "refs/tags/${TAG_NAME}"
          fi
          test "$(git rev-list -n 1 "refs/tags/${TAG_NAME}")" = "${TARGET_SHA}"

      - name: Inspect an existing immutable version image
        id: image-state
        env:
          IMAGE: ${{ needs.preflight.outputs.image }}
          STUDIO_VERSION: ${{ needs.preflight.outputs.studio_version }}
          TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
        run: |
          set -euo pipefail
          image_ref="${IMAGE}:${STUDIO_VERSION}"
          if docker buildx imagetools inspect "${image_ref}" > "${RUNNER_TEMP}/image.txt" 2> "${RUNNER_TEMP}/image-error.txt"; then
            docker buildx imagetools inspect "${image_ref}" --raw > "${RUNNER_TEMP}/image.json"
            jq -e '
              (.manifests | type) == "array"
              and ([.manifests[].platform | "\(.os)/\(.architecture)"] | index("linux/amd64") != null)
              and ([.manifests[].platform | "\(.os)/\(.architecture)"] | index("linux/arm64") != null)
            ' "${RUNNER_TEMP}/image.json" >/dev/null || {
              echo "${image_ref} is not the required linux/amd64 and linux/arm64 image index." >&2
              exit 1
            }
            image_version=$(jq -r '.annotations["org.opencontainers.image.version"] // empty' "${RUNNER_TEMP}/image.json")
            revision=$(jq -r '.annotations["org.opencontainers.image.revision"] // empty' "${RUNNER_TEMP}/image.json")
            test "${image_version}" = "${STUDIO_VERSION}" || {
              echo "${image_ref} already exists with version ${image_version:-missing}." >&2
              exit 1
            }
            test "${revision}" = "${TARGET_SHA}" || {
              echo "${image_ref} already exists with revision ${revision:-missing}." >&2
              exit 1
            }
            digest=$(awk '$1 == "Digest:" { print $2; exit }' "${RUNNER_TEMP}/image.txt")
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo 'exists=true' >> "${GITHUB_OUTPUT}"
            echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          elif grep -Eqi \
            -e 'unauthorized|denied|timeout|connection|TLS|rate limit' \
            -e '401 Unauthorized|403 Forbidden|429 Too Many Requests|5[0-9]{2} (Internal|Bad|Service|Gateway)' \
            "${RUNNER_TEMP}/image-error.txt"; then
            cat "${RUNNER_TEMP}/image-error.txt" >&2
            exit 1
          elif grep -Eqi 'not found|manifest unknown' "${RUNNER_TEMP}/image-error.txt"; then
            echo 'exists=false' >> "${GITHUB_OUTPUT}"
          else
            cat "${RUNNER_TEMP}/image-error.txt" >&2
            exit 1
          fi

  publish-platform:
    name: Build Studio image (${{ matrix.arch }})
    needs:
      - preflight
      - publish-prepare
    if: needs.publish-prepare.outputs.image_exists != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            machine: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.target_sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Require the native build architecture
        run: test "$(uname -m)" = '${{ matrix.machine }}'

      - name: Generate OCI metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest
        with:
          images: ${{ needs.preflight.outputs.image }}
          flavor: latest=false
          tags: type=raw,value=${{ needs.preflight.outputs.studio_version }}
          labels: |
            org.opencontainers.image.title=NebulaGraph Studio
            org.opencontainers.image.description=Self-hosted NebulaGraph Studio with integrated Explorer
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.preflight.outputs.studio_version }}
            org.opencontainers.image.revision=${{ needs.preflight.outputs.target_sha }}
          annotations: |
            org.opencontainers.image.title=NebulaGraph Studio
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.preflight.outputs.studio_version }}
            org.opencontainers.image.revision=${{ needs.preflight.outputs.target_sha }}

      - name: Build and push the native image by digest
        id: push-image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ needs.preflight.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=min
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          build-args: |
            STUDIO_VERSION=${{ needs.preflight.outputs.studio_version }}
            GIT_HASH=${{ needs.preflight.outputs.target_sha }}
            GIT_REF=${{ needs.preflight.outputs.tag_name }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            LICENSES=Apache-2.0

      - name: Verify the pushed platform and runtime
        env:
          IMAGE: ${{ needs.preflight.outputs.image }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
          ARCH: ${{ matrix.arch }}
          STUDIO_VERSION: ${{ needs.preflight.outputs.studio_version }}
          TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
        run: |
          set -euo pipefail
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_ref="${IMAGE}@${DIGEST}"
          docker buildx imagetools inspect "${image_ref}" --raw > "${RUNNER_TEMP}/platform-image.json"
          jq -e --arg arch "${ARCH}" '
            ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch)] | length) == 1
            and ([.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")] | length) == 1
          ' "${RUNNER_TEMP}/platform-image.json" >/dev/null
          runtime_digest=$(jq -r --arg arch "${ARCH}" \
            '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' \
            "${RUNNER_TEMP}/platform-image.json")
          attestation_digest=$(jq -r --arg digest "${runtime_digest}" '
            .manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest"
              and .annotations["vnd.docker.reference.digest"] == $digest) | .digest
          ' "${RUNNER_TEMP}/platform-image.json")
          [[ "${runtime_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${attestation_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "${IMAGE}@${runtime_digest}" --raw > "${RUNNER_TEMP}/runtime-manifest.json"
          jq -e --arg version "${STUDIO_VERSION}" --arg revision "${TARGET_SHA}" '
            .annotations["org.opencontainers.image.version"] == $version
            and .annotations["org.opencontainers.image.revision"] == $revision
          ' "${RUNNER_TEMP}/runtime-manifest.json" >/dev/null

          container="studio-release-${ARCH}-${GITHUB_RUN_ID}"
          docker run --detach --rm --pull=always \
            --name "${container}" \
            --publish 127.0.0.1:17001:7001 \
            --health-interval 1s \
            --health-start-period 1s \
            --health-timeout 2s \
            --health-retries 20 \
            "${image_ref}"
          trap 'docker logs "${container}" || true; docker stop --timeout 10 "${container}" || true' EXIT
          for attempt in {1..30}; do
            health_state=$(docker inspect --format '{{.State.Health.Status}}' "${container}")
            if [ "${health_state}" = healthy ]; then break; fi
            test "${attempt}" -lt 30
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:17001/api-studio/health | grep -Fqx '{"status":"ok"}'
          curl --fail --silent http://127.0.0.1:17001/api-studio/health/ready | grep -Fqx '{"database":"ok"}'
          curl --fail --silent http://127.0.0.1:17001/api-studio/db/oauth2-config | grep -Fq '"enabled":false'
          docker exec "${container}" ./studio -v | grep -F "V${STUDIO_VERSION}"
          docker exec "${container}" /usr/bin/id -u | grep -Fx 10001
          docker stop --timeout 10 "${container}"
          trap - EXIT

          mkdir -p "${RUNNER_TEMP}/oci-digest"
          jq -n \
            --arg arch "${ARCH}" \
            --arg version "${STUDIO_VERSION}" \
            --arg sourceSha "${TARGET_SHA}" \
            --arg digest "${DIGEST}" \
            --arg runtimeDigest "${runtime_digest}" \
            --arg attestationDigest "${attestation_digest}" \
            '{arch: $arch, version: $version, sourceSha: $sourceSha,
              digest: $digest, runtimeDigest: $runtimeDigest, attestationDigest: $attestationDigest}' \
            > "${RUNNER_TEMP}/oci-digest/record.json"
          (cd "${RUNNER_TEMP}/oci-digest" && sha256sum record.json > record.json.sha256)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: studio-oci-${{ matrix.arch }}
          path: ${{ runner.temp }}/oci-digest/
          if-no-files-found: error
          overwrite: true
          retention-days: 3

  publish-finalize:
    name: Publish approved Studio release
    if: >-
      always() && needs.preflight.result == 'success' &&
      needs.release-candidate.result == 'success' &&
      needs.publish-prepare.result == 'success' &&
      (needs.publish-platform.result == 'success' ||
      (needs.publish-prepare.outputs.image_exists == 'true' && needs.publish-platform.result == 'skipped'))
    needs:
      - preflight
      - release-candidate
      - publish-prepare
      - publish-platform
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.target_sha }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: studio-linux-*-release
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.publish-prepare.outputs.image_exists != 'true'
        with:
          name: studio-oci-amd64
          path: ${{ runner.temp }}/oci-digests/amd64

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.publish-prepare.outputs.image_exists != 'true'
        with:
          name: studio-oci-arm64
          path: ${{ runner.temp }}/oci-digests/arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge or reuse the immutable version image
        id: image
        env:
          IMAGE: ${{ needs.preflight.outputs.image }}
          STUDIO_VERSION: ${{ needs.preflight.outputs.studio_version }}
          TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          PREPARED_EXISTING: ${{ needs.publish-prepare.outputs.image_exists }}
          PREPARED_DIGEST: ${{ needs.publish-prepare.outputs.image_digest }}
          DIGEST_ROOT: ${{ runner.temp }}/oci-digests
        run: bash scripts/ci/finalize-release-image.sh

      - name: Create or reuse the GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.preflight.outputs.tag_name }}
          STUDIO_VERSION: ${{ needs.preflight.outputs.studio_version }}
          TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
          IS_PRERELEASE: ${{ needs.preflight.outputs.is_prerelease }}
          IMAGE: ${{ needs.preflight.outputs.image }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          fetch_release() {
            local release release_id
            if ! release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}" 2>/dev/null); then
              release_id=$(gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" --json databaseId --jq .databaseId 2>/dev/null || true)
              if [ -n "${release_id}" ]; then
                release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}")
              else
                release=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" |
                  jq -s --arg tag "${TAG_NAME}" --arg name "NebulaGraph Studio ${STUDIO_VERSION}" '
                    map(select(type == "array")) | add // []
                    | map(select(.tag_name == $tag or (.draft == true and .name == $name)))
                    | if length == 1 then .[0] else empty end') || return 1
              fi
            fi
            test -n "${release}" || return 1
            jq -e 'type == "object"' <<< "${release}" >/dev/null || return 1
            printf '%s\n' "${release}"
          }

          notes="${RUNNER_TEMP}/release-notes.md"
          prev_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude 'v*-*' "${TARGET_SHA}^" 2>/dev/null || true)
          {
            echo '## Changes'
            echo
            if [ -n "${prev_tag}" ]; then
              range="${prev_tag}..${TARGET_SHA}"
            else
              range="${TARGET_SHA}"
            fi
            git log --no-merges --pretty=format:'%h%x09%s' "${range}" |
              awk -F'\t' -v repo="${GITHUB_REPOSITORY}" '
                function section(subject) {
                  if (subject ~ /^feat(\(|:|!)/) return "Features"
                  if (subject ~ /^fix(\(|:|!)/) return "Fixes"
                  return "Other Changes"
                }
                $2 ~ /^chore\(release\)/ { next }
                {
                  name = section($2)
                  items[name] = items[name] "- " $2 " ([" $1 "](https://github.com/" repo "/commit/" $1 "))\n"
                }
                END {
                  split("Features Fixes Other Changes", order, " ")
                  printed = 0
                  for (i = 1; i <= 3; i++) {
                    if (order[i] in items) {
                      printf "### %s\n%s\n", order[i], items[order[i]]
                      printed = 1
                    }
                  }
                  if (!printed) print "- No user-visible changes recorded in this range."
                }
              '
            if [ -n "${prev_tag}" ]; then
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev_tag}...${TAG_NAME}"
            else
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/commits/${TAG_NAME}"
            fi
            echo
            echo '## Delivery metadata'
            echo
            echo "- Version: \`${STUDIO_VERSION}\`"
            echo "- Source commit: \`${TARGET_SHA}\`"
            echo "- OCI image: \`${IMAGE}:${STUDIO_VERSION}@${IMAGE_DIGEST}\`"
            echo '- Linux delivery: tar.gz, DEB and RPM for `amd64` and `arm64` (SHA-256 files attached)'
            echo '- Source downloads: GitHub-generated zip and tar.gz archives for this tag (no project-published checksum)'
            echo '- Upgrade note: back up the Studio database before deployment.'
          } > "${notes}"

          release_json="${RUNNER_TEMP}/release.json"
          if ! fetch_release > "${release_json}"; then
            release_args=(
              --draft
              --verify-tag
              --target "${TARGET_SHA}"
              --title "NebulaGraph Studio ${STUDIO_VERSION}"
              --notes-file "${notes}"
            )
            if [ "${IS_PRERELEASE}" = true ]; then
              release_args+=(--prerelease)
            fi
            gh release create "${TAG_NAME}" "${release_args[@]}"
            fetch_release > "${release_json}"
          fi

          release_id=$(jq -r .id "${release_json}")
          draft=$(jq -r .draft "${release_json}")
          jq -e --arg tag "${TAG_NAME}" '.tag_name == $tag' "${release_json}" >/dev/null || {
            echo "Release is bound to a different tag than ${TAG_NAME}." >&2
            exit 1
          }
          if [ "${draft}" = true ]; then
            jq -e \
              --arg target "${TARGET_SHA}" \
              --argjson prerelease "${IS_PRERELEASE}" \
              '.target_commitish == $target
                and .draft == true
                and .prerelease == $prerelease' \
              "${release_json}" >/dev/null || {
              echo "Draft ${TAG_NAME} does not target ${TARGET_SHA} with the expected prerelease state." >&2
              exit 1
            }
          else
            jq -e --argjson expected "${IS_PRERELEASE}" '.prerelease == $expected' "${release_json}" >/dev/null
          fi

          echo "id=${release_id}" >> "${GITHUB_OUTPUT}"
          echo "draft=${draft}" >> "${GITHUB_OUTPUT}"

      - name: Reuse or upload verified Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STUDIO_VERSION: ${{ needs.preflight.outputs.studio_version }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
          RELEASE_DRAFT: ${{ steps.release.outputs.draft }}
        run: |
          set -euo pipefail
          assets_root="${RUNNER_TEMP}/release-assets"
          release_assets_json="${RUNNER_TEMP}/release-assets.json"

          expected_file="${RUNNER_TEMP}/expected-assets.txt"
          cat "${assets_root}/assets-amd64.txt" "${assets_root}/assets-arm64.txt" | sort -u > "${expected_file}"
          test "$(wc -l < "${expected_file}" | tr -d ' ')" = 12
          while IFS= read -r asset_name; do
            local_path="${assets_root}/${asset_name}"
            test -f "${local_path}"
            local_digest="sha256:$(sha256sum "${local_path}" | cut -d ' ' -f 1)"
            gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" > "${release_assets_json}"
            count=$(jq --arg name "${asset_name}" '[.[] | select(.name == $name)] | length' "${release_assets_json}")
            test "${count}" -le 1 || {
              echo "Release contains duplicate assets named ${asset_name}." >&2
              exit 1
            }
            asset_id=$(jq -r --arg name "${asset_name}" '[.[] | select(.name == $name)][0].id // empty' "${release_assets_json}")
            if [ -n "${asset_id}" ]; then
              remote_digest=$(jq -r --arg name "${asset_name}" '.[] | select(.name == $name) | .digest // empty' "${release_assets_json}")
              asset_state=$(jq -r --arg name "${asset_name}" '.[] | select(.name == $name) | .state // empty' "${release_assets_json}")
              test "${asset_state}" = uploaded && test "${remote_digest}" = "${local_digest}" || {
                echo "Existing asset ${asset_name} has different content." >&2
                exit 1
              }
              echo "Reusing ${asset_name}."
            else
              test "${RELEASE_DRAFT}" = true || {
                echo "Published Release is missing ${asset_name}; immutable assets will not be modified." >&2
                exit 1
              }
              upload_response="${RUNNER_TEMP}/upload-${asset_name}.json"
              curl --fail-with-body --silent --show-error \
                --request POST \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header 'Content-Type: application/octet-stream' \
                --data-binary "@${local_path}" \
                "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${asset_name}" \
                > "${upload_response}"
              jq -e \
                --arg name "${asset_name}" \
                --arg digest "${local_digest}" \
                '.name == $name and .state == "uploaded" and .digest == $digest' \
                "${upload_response}" >/dev/null || {
                echo "GitHub returned unexpected metadata after uploading ${asset_name}." >&2
                exit 1
              }
              echo "Uploaded ${asset_name}."
            fi
          done < "${expected_file}"

          jq -R -s 'split("\n") | map(select(length > 0))' "${expected_file}" > "${RUNNER_TEMP}/expected-assets.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" > "${release_assets_json}"
          jq -e --slurpfile expected "${RUNNER_TEMP}/expected-assets.json" \
            '([.[].name] | sort) == ($expected[0] | sort)' "${release_assets_json}" >/dev/null || {
            echo 'Release asset list differs from the expected immutable set.' >&2
            jq -r '.[].name' "${release_assets_json}" | sort >&2
            exit 1
          }

      - name: Leave the draft for review or verify the published Release
        id: release-state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.preflight.outputs.tag_name }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
          RELEASE_DRAFT: ${{ steps.release.outputs.draft }}
        run: |
          set -euo pipefail
          if [ "${RELEASE_DRAFT}" = true ]; then
            echo 'published=false' >> "${GITHUB_OUTPUT}"
            echo "::notice::${TAG_NAME} stays a draft. Review and publish it in the GitHub UI."
            echo 'The published-release workflow will then promote the immutable image digest automatically.'
            echo "Draft ready for review: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/edit/${TAG_NAME}"
            exit 0
          fi
          echo 'published=true' >> "${GITHUB_OUTPUT}"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            --jq 'select(.draft == false) | .html_url'

      - name: Summarize the release state
        env:
          STUDIO_VERSION: ${{ needs.preflight.outputs.studio_version }}
          TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
          TAG_NAME: ${{ needs.preflight.outputs.tag_name }}
          IMAGE: ${{ needs.preflight.outputs.image }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          PUBLISHED: ${{ steps.release-state.outputs.published }}
        run: |
          {
            if [ "${PUBLISHED}" = true ]; then
              echo '## Studio release published'
            else
              echo '## Studio release draft prepared'
            fi
            echo
            echo "- Version: \`${STUDIO_VERSION}\`"
            echo "- Source: \`${TARGET_SHA}\`"
            echo "- Image: \`${IMAGE}:${STUDIO_VERSION}@${IMAGE_DIGEST}\`"
            if [ "${PUBLISHED}" = true ]; then
              echo '- Channel promotion: handled independently by the published-release workflow.'
            else
              echo '- Channel promotion: waiting for the draft Release to be published.'
              echo '- Next: review and publish the draft Release; promotion then runs automatically.'
              echo "- Draft: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/edit/${TAG_NAME}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
